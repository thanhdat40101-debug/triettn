 ["NƯỚC là thực thể đầu tiên", "Talét – DV tự phát", "Đọc lái: 'TA LẾT xuống NƯỚC'."], ["LỬA là thực thể đầu tiên", "Hêraclít – DV tự phát", "HÊ-RA nghe như HỪNG HỰC LỬA."], ["NGUYÊN TỬ và khoảng không", "Đêmôcrít – DV tự phát", "Đêmôcrít = ông tổ NGUYÊN TỬ."], ["nguyên tử – phần tử nhỏ nhất", "DV siêu hình thế kỷ XVII–XVIII", "Hỏi 'trường phái nào' đồng nhất vật chất = nguyên tử → DV siêu hình 17-18."], ["đặc điểm chung duy vật cổ đại", "dạng cụ thể hữu hình, cảm tính", "Cổ đại = sờ thấy, nhìn thấy = HỮU HÌNH, CẢM TÍNH."], ["Thế nào là phương pháp siêu hình?", "Tất cả các đáp án", "Siêu hình = Cô lập + Tĩnh + Chỉ đổi lượng → gom hết: Tất cả."], ["Thế giới quan KHOA HỌC dựa trên", "Chủ nghĩa duy vật", "Khoa học tin bằng chứng thực tế → Duy VẬT."], ["KHÔNG phải tiền đề KHTN của Mác", "Nguyên tử luận", "Tiền đề của Mác chỉ có NĂNG – BÀO – HÓA → loại Nguyên tử luận."], ["3 phát minh chứng minh tính gì?", "Tính biện chứng của vận động, phát triển", "Năng-Bào-Hóa chứng minh thế giới luôn động, liên hệ → TÍNH BIỆN CHỨNG."], ["Phép biện chứng cổ đại là?", "Biện chứng tự phát, chất phác", "Cứ thấy 'cổ đại' → bắt cặp TỰ PHÁT, CHẤT PHÁC."], ["câu trả lời thuộc DUY TÂM (mâu thuẫn)", "do con người tạo ra", "Thấy 'do con người tạo ra / ý muốn chủ quan' = DUY TÂM."], ["lập trường DUY VẬT SIÊU HÌNH", "loại bỏ hoàn toàn sự vật cũ", "Siêu hình = cực đoan, XÓA SẠCH ('hoàn toàn'). Biện chứng = có kế thừa."], ["vật thể hữu hình, cảm tính (câu 47)", "DV siêu hình XVII–XVIII", "⚠️ BẪY ĐỀ NÀY: Câu 39 đáp Cổ đại, nhưng câu 47 key file chấm C (Siêu hình 17-18)."], ["nguyên tử là quan điểm trường phái", "DV siêu hình XVII–XVIII", "Đồng nhất vật chất = nguyên tử (hỏi trường phái) → Siêu hình XVII–XVIII."], ["HẠN CHẾ duy vật cổ đại", "tự phát, chất phác, ngây thơ", "Cổ đại: Hạn chế = NGÂY THƠ, chất phác (còn Tích cực = chống tôn giáo)."], ["MẶT TÍCH CỰC duy vật cổ đại", "Chống duy tâm, tôn giáo", "Tích cực = CHỐNG thần thánh/duy tâm."], ["ĐỈNH CAO duy vật cổ đại", "Nguyên tử (Lơxíp – Đêmôcrít)", "Nước < Lửa < NGUYÊN TỬ (xịn nhất thời cổ đại)."], ["cảm giác được là vật chất", "DV siêu hình", "⚠️ BẪY ĐỀ NÀY: Đồng nhất vật chất với cái sờ/cảm giác được → key file chấm A (Siêu hình)."], ["chép lại, chụp lại, phản ánh lại", "Con người CÓ KHẢ NĂNG nhận thức", "Chụp lại được = NHẬN THỨC ĐƯỢC thế giới (chống bất khả tri)."], ["DVBC về phản ánh (câu 54)", "đặc tính riêng của bộ não người", "⚠️ BẪY ĐỀ NÀY: Key file chấm B (bộ não người - ý chỉ phản ánh ý thức)."], ["thuộc tính cố hữu & phương thức tồn tại", "Tất cả các đáp án", "3 ý đều nói vật chất gắn chặt với vận động → Tất cả."], ["Nguyên tắc từ Vật chất – Ý thức", "Nguyên tắc khách quan", "Vật chất trước → phải tôn trọng KHÁCH QUAN."], ["Lựa chọn mệnh đề đúng (vận động)", "Tất cả các đáp án", "Cao chứa thấp, 1 vật nhiều vận động → đúng hết → Tất cả."], ["Cha mẹ sinh con, TRỜI sinh tính", "Duy tâm khách quan", "Chữ 'TRỜI' (thế lực ngoài người) = Duy tâm KHÁCH QUAN."], ["CNDV gồm những hình thức nào?", "Tất cả các đáp án trên", "Đủ 3 đời Duy vật: Cổ đại – Siêu hình – Biện chứng → Tất cả."], ["nguồn gốc XÃ HỘI của ý thức", "Lao động và ngôn ngữ", "Thần chú: Tự nhiên = ÓC + THẾ GIỚI | Xã hội = LAO ĐỘNG + NGÔN NGỮ."], ["bản chất của ý thức", "phản ánh năng động, sáng tạo", "Bắt 2 từ vàng của Ý thức: NĂNG ĐỘNG, SÁNG TẠO."], ["xuất phát từ thực tế, tôn trọng khách quan", "Mối quan hệ Vật chất – Ý thức", "Thực tế khách quan = Vật chất; Chủ trương đường lối = Ý thức."], ["vai trò của ý thức (DVBC)", "sáng tạo + tác động trở lại qua thực tiễn", "Chọn câu dài, đủ 2 vế: Phản ánh sáng tạo + Tác động lại qua THỰC TIỄN."], ["tuyệt đối hóa vai trò VẬT CHẤT", "Giáo điều, phiến diện", "Thần chú bệnh: Quá Ý THỨC → Duy ý chí | Quá VẬT CHẤT → Giáo điều, phiến diện."], ["Tính khách quan của mối liên hệ", "vốn có, tồn tại bên ngoài ý thức", "Khách quan = VỐN CÓ, NGOÀI Ý THỨC."], ["từ nguyên lý Mối liên hệ phổ biến", "Toàn diện + Lịch sử cụ thể", "Liên hệ phổ biến → đẻ ra 2 quan điểm: TOÀN DIỆN & LỊCH SỬ CỤ THỂ."], ["chọn đáp án SAI về phát triển", "chỉ tăng/giảm lượng, không đổi chất", "Thấy chữ 'CHỈ' + 'không đổi chất' = tư duy siêu hình → SAI."], ["định nghĩa vật chất Lênin ở tác phẩm nào?", "CNDV và CN kinh nghiệm phê phán", "Mẹo nhanh: Chọn tên sách DÀI NHẤT có chữ 'phê phán'."], ["đặc tính quan trọng nhất của vật chất", "Thực tại khách quan độc lập ý thức", "Lênin chốt 1 cụm: THỰC TẠI KHÁCH QUAN."], ["Định nghĩa vật chất Lênin có ý nghĩa gì?", "Tất cả các đáp án", "3 ý đều chuẩn sách → Tất cả."], ["Ăngghen chia vận động thành mấy?", "5 hình thức", "Đếm 5 ngón tay: CƠ – LÝ – HÓA – SINH – XÃ."], ["Nội dung QH biện chứng VC – YT", "VC quyết định + YT tác động lại qua thực tiễn", "Biện chứng là 2 CHIỀU: Vật quyết định Ý, Ý tác động lại qua THỰC TIỄN."], ["vận động là mọi biến đổi nói chung", "Chủ nghĩa duy vật biện chứng", "Hiểu rộng 'mọi biến đổi' là của DV BIỆN CHỨNG."], ["chép lại, chụp lại, phản ánh lại (câu 74)", "Cảm giác, ý thức là sự phản ánh TGKQ", "Đề có chữ 'phản ánh lại' → chốt đáp án có 'PHẢN ÁNH thế giới khách quan'."], ["Theo DVBC, ý thức là?", "Hình ảnh chủ quan của thế giới khách quan", "Câu kinh điển: Hình ảnh CHỦ QUAN của thế giới KHÁCH QUAN."], ["nguồn gốc của vận động ở đâu?", "Ở BÊN TRONG sự vật", "Tự thân vận động = do mâu thuẫn BÊN TRONG, không ai đẩy từ ngoài."], ["vật chất (phạm trù triết học) có đặc tính", "Vô hạn, vô tận, vĩnh viễn, độc lập", "Vật chất nói chung không sinh không diệt → VÔ HẠN, VÔ TẬN."], ["vận động và đứng im: vận động là?", "Tuyệt đối", "Thần chú: Vận động TUYỆT ĐỐI – Đứng im TƯƠNG ĐỐI."], ["thay đổi vị trí trong không gian", "Vận động cơ học", "CƠ = dịch chuyển vị trí (xe chạy, bóng lăn)."], ["tương tác phân tử, hạt cơ bản", "Vận động vật lý", "LÝ = hạt, phân tử, nhiệt, điện."], ["trao đổi chất cơ thể sống", "Vận động sinh học", "SINH = cơ thể sống, trao đổi chất."], ["đặc trưng của con người & xã hội", "Vận động xã hội", "Đề có chữ 'xã hội loài người' → chọn ngay Vận động XÃ HỘI."], ["vận động đa dạng, phức tạp nhất", "Vận động xã hội", "Thang Cơ–Lý–Hóa–Sinh–XÃ → XÃ HỘI đứng chót nên phức tạp nhất."], ["vai trò ý thức đối với vật chất", "tác động trở lại qua hoạt động thực tiễn", "Ý thức KHÔNG tự đẻ ra vật chất, phải qua THỰC TIỄN (bắt tay làm)."], ["từ QH vật chất – ý thức rút ra nguyên tắc", "Xuất phát từ KQ + Phát huy năng động CQ", "Đủ cả 2 vế: Tôn trọng KHÁCH QUAN + Phát huy CHỦ QUAN."], ["Bệnh chủ quan duy ý chí là?", "chỉ căn cứ vào mong muốn chủ quan", "Duy ý chí = thích làm theo Ý MUỐN CHỦ QUAN, bất chấp thực tế."], ["chủ trương Đảng xuất phát từ thực tế", "Mối quan hệ Vật chất – Ý thức", "Thực tế = Vật chất; Chủ trương = Ý thức (trùng ý câu 62)."], ["Theo DVBC, ý thức là? (câu 88)", "phản ánh năng động, sáng tạo của não bộ", "Thấy combo 'NĂNG ĐỘNG, SÁNG TẠO + NÃO BỘ' là khoanh ngay."], ["khác nhau giữa phản ánh ý thức với loại khác", "Tính định hướng, tích cực, sáng tạo", "Người khác đá/cây ở chỗ có mục đích, TÍCH CỰC, SÁNG TẠO."], ["Ăngghen: [...] đã sáng tạo ra bản thân con người", "Lao động… lao động", "Câu bất hủ của Ăngghen: LAO ĐỘNG tạo ra con người."], ["hình thức vận động THẤP nhất", "Vận động cơ học", "CƠ–Lý–Hóa–Sinh–Xã → Đầu bảng là CƠ (thấp nhất)."], ["vận động tuyệt đối, đứng im tương đối", "Chủ nghĩa duy vật biện chứng", "Vừa tuyệt đối vừa tương đối = tư duy 2 mặt = DV BIỆN CHỨNG."], ["Duy tâm tìm sự thống nhất thế giới ở", "ý niệm tuyệt đối hoặc ý thức con người", "Duy TÂM thì tìm ở Ý NIỆM / Ý THỨC (Duy vật mới tìm ở vật chất)."], ["Thuộc tính đặc trưng của vật chất", "Thực tại khách quan không lệ thuộc cảm giác", "Cụm khóa vàng của Lênin: THỰC TẠI KHÁCH QUAN."], ["Theo DVBC, đứng im là?", "vận động trong thăng bằng", "Đứng im KHÔNG phải chết cứng, mà là VẬN ĐỘNG TRONG THĂNG BẰNG."], ["ý thức tác động lại vật chất thông qua", "Hoạt động thực tiễn", "Nghĩ trong đầu chưa đổi được đời, phải hành động = THỰC TIỄN."], ["Duy tâm về nguồn gốc ý thức", "sản phẩm của thần linh, Thượng Đế", "Duy tâm = đổ cho THẦN LINH, THƯỢNG ĐẾ."], ["nguồn gốc TỰ NHIÊN của ý thức", "Bộ óc người + Thế giới bên ngoài", "Tự nhiên = ÓC + THẾ GIỚI (chọn câu có đủ cả 2, đừng chọn mỗi bộ óc)."], ["nguồn gốc XÃ HỘI của ý thức", "Lao động và ngôn ngữ", "Xã hội = LAO ĐỘNG + NGÔN NGỮ (nhớ: làm chung phải nói chuyện)."], ["Mác: yếu tố đầu tiên đảm bảo tồn tại", "Lao động", "Muốn sống phải làm việc → LAO ĐỘNG."], ["quá trình hình thành ý thức là", "phản ánh sáng tạo và cải tạo thế giới", "Bắt cặp từ 'SÁNG TẠO + CẢI TẠO'."], ["Để phản ánh hiện thực cần có gì?", "Cơ quan cảm giác", "Muốn biết bên ngoài có gì phải nhìn, nghe, sờ → CƠ QUAN CẢM GIÁC."], ["nguồn gốc TRỰC TIẾP, QUAN TRỌNG NHẤT", "Lao động, thực tiễn xã hội", "Nguồn gốc tự nhiên là điều kiện cần; LAO ĐỘNG/THỰC TIỄN mới quyết định."], ["bản chất ý thức (câu 104)", "phản ánh SÁNG TẠO vào bộ óc người", "Loại 'nguyên xi', chọn 'SÁNG TẠO'."], ["tính SÁNG TẠO của ý thức là", "tạo hình ảnh mới trong tư duy", "Ý thức chỉ vẽ ra HÌNH ẢNH MỚI TRONG ĐẦU (không tự biến ra vật thật)."], ["kết cấu ý thức: CƠ BẢN, CỐT LÕI NHẤT", "Tri thức", "Không hiểu biết thì chịu → TRI THỨC là lõi (quan trọng hơn tình cảm, ý chí)."], ["kết cấu theo CHIỀU DỌC của ý thức", "Tự ý thức – Tiềm thức – Vô thức", "Thần chú chiều DỌC (đều có chữ THỨC): TỰ – TIỀM – VÔ (loại câu có AI)."], ["DVBC về mối quan hệ VC – YT (câu 108)", "VC quyết định + YT độc lập tương đối, tác động lại", "Chọn câu đầy đủ nhất: VC quyết định + YT độc lập tương đối + qua THỰC TIỄN."], ["vô cơ, sinh vật, xã hội hoàn toàn tách biệt", "Duy vật siêu hình", "Thấy 'tách rời / không quan hệ gì' = SIÊU HÌNH."], ["Ăngghen: ... sáng tạo ra bản thân con người", "Lao động", "Gặp câu này nhắm mắt chọn LAO ĐỘNG."], ["năng động chủ quan phải dựa trên cơ sở vật chất", "Chủ nghĩa duy vật biện chứng", "Kết hợp cả Vật chất lẫn Chủ quan = DV BIỆN CHỨNG."], ["mọi tri thức đều dựa trên cơ sở thực tiễn", "Chủ nghĩa duy vật biện chứng", "Đề cao THỰC TIỄN = đặc sản của DV BIỆN CHỨNG."], ["Phép BCDV có mấy nguyên lý?", "Hai nguyên lý", "Thần chú số lượng: 2 Nguyên lý – 3 Quy luật – 6 Cặp phạm trù."], ["2 nguyên lý cơ bản là gì?", "Mối liên hệ phổ biến & Sự phát triển", "2 Nguyên lý: LIÊN HỆ PHỔ BIẾN + PHÁT TRIỂN."], ["cơ sở của quan điểm TOÀN DIỆN", "Nguyên lý mối liên hệ phổ biến", "Liên hệ chằng chịt → phải nhìn TOÀN DIỆN."], ["quan điểm TOÀN DIỆN yêu cầu gì?", "xem tất cả mối liên hệ + phân loại vị trí, vai trò", "Nhìn hết chưa đủ, phải biết cái nào CHÍNH – PHỤ (chọn câu dài đủ 2 ý)."], ["Lựa chọn phương án đúng nhất (mối liên hệ)", "diễn ra GIỮA các sự vật VÀ NGAY TRONG sự vật", "Loại mấy câu có chữ 'CHỈ' → chọn câu bao cả ngoài lẫn trong."], ["đồng hóa và dị hóa được gọi là", "Hai mặt đối lập", "Đồng hóa (nạp) ↔ Dị hóa (thải) = 2 MẶT ĐỐI LẬP."], ["chủ quan NÓNG VỘI vi phạm quy luật nào?", "Quy luật Lượng – Chất", "Nóng vội (chưa đủ lượng đã đòi nhảy) / Bảo thủ (đủ lượng không dám nhảy) = LƯỢNG–CHẤT."], ["quan niệm SAI về phủ định biện chứng", "chấm dứt sự phát triển", "Phủ định biện chứng là để ĐI LÊN, không bao giờ 'chấm dứt'."], ["ý nghĩa QL mâu thuẫn – chọn SAI", "mâu thuẫn phụ thuộc cảm nhận con người", "Thấy 'phụ thuộc cảm nhận / ý chí con người' → auto SAI."], ["quan điểm SIÊU HÌNH về phát triển", "Chất không thay đổi", "Siêu hình = chỉ tăng giảm số lượng, CHẤT KHÔNG ĐỔI."], ["Trong XÃ HỘI, phát triển biểu hiện", "thay chế độ XH cũ bằng chế độ cao hơn", "Đề hỏi 'trong xã hội' → chọn đáp án có 'CHẾ ĐỘ XÃ HỘI cao hơn'."], ["tính chất của sự phát triển", "Tất cả các đáp án", "Khách quan + Phổ biến + Đa dạng phong phú (+ Kế thừa) → Tất cả."], ["quan điểm PHÁT TRIỂN dựa trên nguyên lý nào?", "Nguyên lý về sự phát triển", "Hỏi gì đáp nấy: Quan điểm Phát triển ← Nguyên lý Phát triển."], ["quan hệ Cái chung – Cái riêng", "Cái chung tồn tại thông qua cái riêng", "Không có 'con vật nói chung' chạy ngoài đường, chỉ có trong con chó/mèo cụ thể."], ["quan hệ Nhân – Quả", "1 nguyên nhân có thể sinh các kết quả khác nhau", "⚠️ BẪY ĐỀ NÀY: Key chấm C (trong điều kiện nhất định có thể sinh các kết quả khác nhau)."], ["quan hệ Nội dung – Hình thức", "Nội dung quyết định hình thức", "Tốt gỗ hơn tốt nước sơn → NỘI DUNG quyết định HÌNH THỨC."], ["quan hệ Bản chất – Hiện tượng", "Bản chất đổi thì hiện tượng đổi theo", "Loại 'độc lập', 'đồng nhất', 'bất biến' → chọn Bản chất đổi → Hiện tượng đổi."], ["quan hệ Khả năng – Hiện thực", "dựa vào hiện thực, đồng thời tính khả năng", "Sống trên HIỆN THỰC nhưng phải tính trước KHẢ NĂNG (đủ 2 vế)."], ["chọn SAI về Chất", "Chất đồng nhất với thuộc tính", "Chất ≠ 1 thuộc tính lẻ, mà là TỔNG HỢP các thuộc tính → 'đồng nhất' là SAI."], ["chọn SAI về Chất (câu 132)", "Chất tồn tại BÊN NGOÀI sự vật", "Không có cái ngọt bay lơ lửng ngoài cục đường → 'bên ngoài' là SAI."], ["chọn SAI về Lượng", "Lượng phụ thuộc ý chí con người", "Cứ thấy 'phụ thuộc ý chí con người' là auto SAI."], ["Độ là gì?", "giới hạn đổi lượng mà CHƯA đổi chất", "Còn nằm trong ĐỘ = chất CHƯA đổi."], ["khoảng từ 0°C đến 100°C", "Độ", "0°C–100°C nước vẫn là nước lỏng (chưa đổi chất) = ĐỘ."], ["lỏng chuyển sang khí tại 100°C", "Bước nhảy", "Chuyển hẳn sang chất mới (lỏng → khí) = BƯỚC NHẢY. (Riêng mốc 100°C là Điểm nút)."], ["nói lên quy mô, trình độ", "Lượng", "Quy mô, số lượng, tốc độ, trình độ (đo đếm được) = LƯỢNG."], ["chọn SAI (Độ / Lượng / Chất)", "trong độ, đổi lượng ĐỀU đổi chất", "Trong độ chất CHƯA đổi → nói 'đều đổi chất' là SAI."], ["Theo DVBC (lượng – chất, câu 139)", "Không phải mọi đổi chất đều do đổi lượng", "⚠️ BẪY ĐỀ NÀY: Key chấm B (VD: đổi cấu trúc đồng phân dù cùng số lượng nguyên tử)."], ["Theo DVBC (quá trình phát triển, câu 140)", "biến đổi đồng thời của lượng và chất", "⚠️ BẪY ĐỀ NÀY: Key file chấm D (biến đổi đồng thời), cẩn thận kẻo chọn nhầm C!"], ["TRÌ TRỆ, BẢO THỦ vi phạm quy luật nào?", "Quy luật Lượng – Chất", "Nhớ cặp bệnh của Lượng–Chất: NÓNG VỘI (tả) & BẢO THỦ TRÌ TRỆ (hữu)."], ["cơ sở quan điểm TOÀN DIỆN", "Nguyên lý mối liên hệ phổ biến", "Toàn diện ← Mối liên hệ phổ biến (trùng câu 115)."], ["Nguyên lý PHÁT TRIỂN yêu cầu nguyên tắc gì?", "Phát triển", "Nguyên lý Phát triển → Nguyên tắc PHÁT TRIỂN."], ["vạch ra NGUỒN GỐC, ĐỘNG LỰC", "QL Thống nhất & đấu tranh (Mâu thuẫn)", "Thần chú 3 QL: MÂU NGUỒN – LƯỢNG CÁCH – PHỦ HƯỚNG."], ["vạch ra CÁCH THỨC (phương thức)", "QL Lượng – Chất", "MÂU NGUỒN – LƯỢNG CÁCH – PHỦ HƯỚNG → Cách thức = Lượng–Chất."], ["Một cây... Ba cây chụm lại nên hòn núi cao", "QL Lượng – Chất", "1 cây → 3 cây (tăng LƯỢNG) → hòn núi (đổi CHẤT)."], ["đồng hóa và dị hóa là gì?", "Hai mặt đối lập", "Nạp vào ↔ Thải ra = 2 MẶT ĐỐI LẬP (trùng câu 118)."], ["nói lên sự vật LÀ CÁI GÌ, phân biệt cái khác", "Chất", "CHẤT trả lời câu hỏi 'Nó là cái gì?'."], ["con số các thuộc tính cấu thành", "Lượng", "Thấy chữ 'CON SỐ' = LƯỢNG."], ["sự thống nhất giữa chất và lượng", "Phạm trù Độ", "Chất + Lượng sống hòa bình với nhau = ĐỘ."], ["điểm giới hạn đổi lượng làm đổi chất", "Điểm nút", "Đề có chữ 'ĐIỂM giới hạn' → ĐIỂM NÚT."], ["giai đoạn chuyển hóa về chất", "Bước nhảy", "Lúc biến hình sang chất mới = BƯỚC NHẢY."], ["vạch ra KHUYNH HƯỚNG phát triển", "QL Phủ định của phủ định", "MÂU NGUỒN – LƯỢNG CÁCH – PHỦ HƯỚNG → Khuynh hướng = Phủ định."], ["Mác-Lênin về sự phát triển", "Phủ định biện chứng", "Phát triển = PHỦ ĐỊNH BIỆN CHỨNG (cái mới kế thừa cái cũ)."], ["khuynh hướng phát triển theo đường nào?", "Đường xoáy ốc đi lên", "Phát triển không thẳng tắp, không vòng tròn → ĐƯỜNG XOÁY ỐC ĐI LÊN."], ["QL Lượng – Chất giải thích điều gì?", "Cách thức (phương thức) biến đổi", "MÂU NGUỒN – LƯỢNG CÁCH – PHỦ HƯỚNG."], ["chọn SAI về mặt đối lập", "không nhất thiết gắn liền sự vật", "Mặt đối lập là vốn có, luôn GẮN LIỀN sự vật → 'không nhất thiết' là SAI."], ["ràng buộc nhau, làm tiền đề cho nhau", "Thống nhất của hai mặt đối lập", "Nương tựa, ràng buộc = THỐNG NHẤT | Bài trừ = ĐẤU TRANH."], ["biểu hiện của THỐNG NHẤT", "cùng tồn tại, nương tựa, làm tiền đề", "Thống nhất = NƯƠNG TỰA, CÙNG TỒN TẠI."], ["xu hướng ĐẤU TRANH là gì?", "Phủ định, bài trừ nhau", "Đấu tranh = đánh nhau = PHỦ ĐỊNH, BÀI TRỪ."], ["các mặt đối lập quan hệ thế nào?", "Vừa thống nhất, vừa đấu tranh", "Biện chứ const LS="triet_quiz_v1",ALL=Q.map((_,i)=>i),L=["A","B","C","D"];
const isTrap=id=>TIPS[id-1][2].includes("⚠️");
let S={ans:{},saved:{},order:ALL.slice(),pos:0,theme:"",done:false,view:"quiz"};
try{
  const t=JSON.parse(localStorage.getItem(LS));
  if(t&&Array.isArray(t.order)&&t.ans)S=Object.assign(S,t);
  if(!S.saved)S.saved={};
  if(!["quiz","study","mantra","modes"].includes(S.view))S.view="quiz";
}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
let HINT=false,SHEET=false,FSEARCH="",FONLY="all",RC=false,MSG="",TIMER=null;

function applyTheme(){
  if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
  else document.documentElement.removeAttribute("data-theme");
  const dark=S.theme==="dark"||(!S.theme&&matchMedia("(prefers-color-scheme:dark)").matches);
  const tc=$("#tc");if(tc)tc.setAttribute("content",dark?"#0f1219":"#f2f5fa");
}
function tg(){S.theme=S.theme==="dark"?"light":"dark";applyTheme();save()}
function toast(t){MSG=t;renderToast();clearTimeout(TIMER);TIMER=setTimeout(()=>{MSG="";renderToast()},2600)}
function renderToast(){
  const old=$(".toast");if(old)old.remove();
  if(MSG){const d=document.createElement("div");d.className="toast";d.textContent=MSG;document.body.appendChild(d)}
}
function stats(){let c=0,w=0;Q.forEach(q=>{const a=S.ans[q.id];if(a)a===q.answer?c++:w++});return{c,w,n:c+w}}
function nsv(){return Object.keys(S.saved).length}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function setView(v){S.view=v;HINT=false;SHEET=false;RC=false;save();render();scrollTo(0,0)}
function openSheet(b){SHEET=b;render()}
function go(i){
  let k=S.order.indexOf(i);
  if(k<0){S.order=ALL.slice();k=i}
  S.pos=k;S.done=false;S.view="quiz";HINT=false;SHEET=false;save();render();scrollTo(0,0);
}
function pick(l){
  const q=Q[S.order[S.pos]];
  if(S.ans[q.id])return;
  S.ans[q.id]=l;HINT=false;save();render();
}
function nav(d){
  const k=S.pos+d;if(k<0)return;
  HINT=false;
  if(k>=S.order.length)S.done=true;
  else S.pos=k;
  save();render();scrollTo(0,0);
}
function jump(inpId){
  const el=$("#"+inpId);if(!el)return;
  const n=+el.value;if(!n||n<1||n>200){toast("Nhập số câu từ 1 đến 200");return}
  let i=S.order.findIndex(x=>Q[x].no===n);
  if(i>=0){S.pos=i;S.done=false;S.view="quiz";HINT=false;SHEET=false;save();render();scrollTo(0,0)}
  else{const j=ALL.find(x=>Q[x].no===n);go(j)}
}
function sv(id){
  if(S.saved[id]){delete S.saved[id];toast("Đã bỏ lưu câu")}
  else{S.saved[id]=1;toast("★ Đã lưu để ôn lại")}
  save();render();
}
function toggleHint(){HINT=!HINT;render()}
function mode(m){
  if(m==="all")S.order=ALL.slice();
  else if(m==="rand")S.order=shuf(ALL.slice());
  else if(m==="trap"){const w=Q.filter(q=>isTrap(q.id));w.forEach(q=>delete S.ans[q.id]);S.order=w.map(q=>q.id-1)}
  else if(m==="wrong"){const w=Q.filter(q=>S.ans[q.id]&&S.ans[q.id]!==q.answer);if(!w.length){toast("Bạn chưa có câu nào sai!");return}w.forEach(q=>delete S.ans[q.id]);S.order=w.map(q=>q.id-1)}
  else if(m==="saved"){const w=Q.filter(q=>S.saved[q.id]);if(!w.length){toast("Bạn chưa lưu câu nào!");return}w.forEach(q=>delete S.ans[q.id]);S.order=w.map(q=>q.id-1)}
  else if(m==="todo"){const w=Q.filter(q=>!S.ans[q.id]);if(!w.length){toast("Bạn đã làm hết tất cả câu!");return}S.order=w.map(q=>q.id-1)}
  else if(m==="range"){
    const a=+$("#r1").value,b=+$("#r2").value;
    const o=ALL.filter(i=>Q[i].no>=a&&Q[i].no<=b);
    if(!a||!b||a>b||!o.length){toast("Khoảng câu không hợp lệ");return}
    S.order=o;
  }
  S.pos=0;S.done=false;S.view="quiz";HINT=false;SHEET=false;save();render();scrollTo(0,0);
}
function reset(){
  if(!RC){RC=true;render();return}
  RC=false;S.ans={};S.order=ALL.slice();S.pos=0;S.done=false;HINT=false;save();toast("Đã xóa kết quả, làm lại từ đầu");render();scrollTo(0,0);
}
function noRC(){RC=false;render()}

function tipBox(id,hideAns){
  const t=TIPS[id-1],w=isTrap(id);
  if(hideAns)return `<div class="tip ${w?"warn":""}"><div class="trow"><span class="tag tk">🔍 Nhìn đề: ${t[0]}</span></div><div class="th">💡 <b>Gợi ý:</b> ${t[2]}</div></div>`;
  return `<div class="tip ${w?"warn":""}"><div class="trow"><span class="tag tk">🔍 ${t[0]}</span><span>➜</span><span class="tag ta">🎯 ${t[1]}</span></div><div class="th">🧠 ${t[2]}</div></div>`;
}

function gridHTML(cur){
  return `<div class="g">${Q.map((q,i)=>{
    const a=S.ans[q.id];
    return `<button class="${a?(a===q.answer?"ok":"no"):""} ${i===cur?"cur":""} ${S.saved[q.id]?"sv":""} ${isTrap(q.id)?"tp":""}" onclick="go(${i})">${q.no}</button>`;
  }).join("")}</div>`;
}

function headerHTML(){
  const s=stats();
  return `<header class="hdr">
    <div class="hdr-in">
      <div class="brand"><span>🎓</span><h1>Triết Mác - Lênin</h1></div>
      <div class="pills">
        <span class="pill ok">✓ ${s.c}</span>
        <span class="pill no">✗ ${s.w}</span>
        <button class="ibtn" onclick="tg()" aria-label="Đổi giao diện sáng/tối">◐</button>
      </div>
    </div>
    <div class="pbar"><i style="width:${(s.n/Q.length*100).toFixed(1)}%"></i></div>
  </header>`;
}

function tabbarHTML(){
  return `<nav class="tabbar" aria-label="Điều hướng chính">
    <div class="tabbar-in">
      <button class="tab ${S.view==="quiz"?"on":""}" onclick="setView('quiz')"><span class="ic">📝</span><span>Làm bài</span></button>
      <button class="tab ${S.view==="study"?"on":""}" onclick="setView('study')"><span class="ic">⚡</span><span>Học Mẹo</span></button>
      <button class="tab ${S.view==="mantra"?"on":""}" onclick="setView('mantra')"><span class="ic">🔮</span><span>Thần chú</span></button>
      <button class="tab ${S.view==="modes"?"on":""}" onclick="setView('modes')"><span class="ic">⚙️</span><span>Chế độ</span></button>
    </div>
  </nav>`;
}

function sheetHTML(cur){
  if(!SHEET)return "";
  return `<div class="sheet-bg" onclick="if(event.target===this)openSheet(false)">
    <div class="sheet">
      <div class="sh-hd">
        <h2>Chọn nhanh câu hỏi (1–200)</h2>
        <button class="ibtn" onclick="openSheet(false)" aria-label="Đóng">✕</button>
      </div>
      <div class="sh-bd">
        <div class="rrow" style="margin-top:0">
          <input id="jn" class="inp" type="number" inputmode="numeric" min="1" max="200" placeholder="Nhập số câu (1–200)..." onkeydown="if(event.key==='Enter')jump('jn')">
          <button class="b p" onclick="jump('jn')">Đi tới</button>
        </div>
        <div class="legend">
          <span>🟢 Đúng</span><span>🔴 Sai</span><span>★ Đã lưu</span><span style="color:var(--wn);font-weight:700">! Câu bẫy key</span>
        </div>
        ${gridHTML(cur)}
      </div>
    </div>
  </div>`;
}

function mantraView(){
  const traps=Q.filter(q=>isTrap(q.id)).length;
  const items=[
    ['1. Ba nền cổ đại — "HY TỰ · ẤN TÔN · TRUNG CHÍNH"','Hy Lạp = Tự nhiên · Ấn Độ = Tôn giáo · Trung Quốc = Chính trị, đạo đức.'],
    ['2. Ba nhà cổ đại — "Ta lết NƯỚC · Hê-ra LỬA · Đê-mô NGUYÊN TỬ"','Talét = Nước · Hêraclít = Lửa · Đêmôcrít = Nguyên tử (đỉnh cao cổ đại).'],
    ['3. Thứ tự thế giới quan — "THẦN · TÔN · TRIẾT"','Thần thoại → Tôn giáo → Triết học (cao nhất).'],
    ['4. Mặt 1 & Mặt 2 — "1 AI TRƯỚC? · 2 BIẾT KHÔNG?"','Mặt 1 = Duy vật / Duy tâm · Mặt 2 = Khả tri / Bất khả tri.'],
    ['5. Chủ quan vs Khách quan — "CẢM GIÁC TÔI · TRỜI/THẦN/Ý NIỆM"','Thấy "cảm giác con người" → Chủ quan. Thấy "trời, thần, ý niệm tuyệt đối" → Khách quan.'],
    ['6. Ba phát minh KHTN — "NĂNG · BÀO · HÓA"','Bảo toàn Năng lượng · Tế bào · Tiến hóa (Loại ngay Nguyên tử luận!).'],
    ['7. Năm hình thức vận động — "CƠ · LÝ · HÓA · SINH · XÃ"','Thấp nhất = Cơ học · Cao & phức tạp nhất = Xã hội. Vận động TUYỆT ĐỐI, đứng im TƯƠNG ĐỐI.'],
    ['8. Nguồn gốc Ý thức — "ÓC+GIỚI (Tự nhiên) · LAO+NGÔN (Xã hội)"','Tự nhiên = Bộ óc + Thế giới khách quan · Xã hội = Lao động + Ngôn ngữ. Chiều dọc: <b>TỰ – TIỀM – VÔ</b> thức.'],
    ['9. Ba quy luật — "MÂU NGUỒN · LƯỢNG CÁCH · PHỦ HƯỚNG"','Mâu thuẫn = Nguồn gốc/động lực (Hạt nhân) · Lượng–Chất = Cách thức (Nóng vội/Bảo thủ) · Phủ định = Khuynh hướng (Xoáy ốc đi lên).'],
    ['10. Nhận thức & Câu SAI — "CẢM TRI BIỂU | KHÁI PHÁN SUY"','Cảm tính: Cảm giác, Tri giác, Biểu tượng · Lý tính: Khái niệm, Phán đoán, Suy lý.<br>Mẹo câu hỏi SAI: Thấy <b>"phụ thuộc ý chí/cảm nhận"</b>, <b>"xóa bỏ hoàn toàn"</b>, <b>"chỉ đổi lượng"</b> → chọn ngay!']
  ];
  return `<main class="main">
    <div class="cd" style="background:var(--ac2);border-color:var(--ac)">
      <div style="font-weight:750;font-size:16px;margin-bottom:4px">🔮 10 Câu Thần Chú cân 80% đề Triết</div>
      <div class="mu" style="color:var(--act)">Đọc thuộc 10 khung này trước khi bấm làm bài sẽ tăng tốc độ khoanh lên gấp 3 lần.</div>
    </div>
    ${items.map(x=>`<div class="mc"><div class="mc-t">${x[0]}</div><div class="mc-b">${x[1]}</div></div>`).join("")}
    <button class="b w" style="width:100%" onclick="mode('trap')">⚠️ Vào làm thử ${traps} câu bẫy đề ngay</button>
  </main>`;
}

function setFOnly(v){FONLY=v;render()}
function onSearch(el){FSEARCH=el.value;renderStudyList()}
function clearSearch(){FSEARCH="";render()}
function renderStudyList(){
  const kw=FSEARCH.trim().toLowerCase();
  const list=Q.filter(q=>{
    if(FONLY==="trap"&&!isTrap(q.id))return false;
    if(FONLY==="wrong"&&!(S.ans[q.id]&&S.ans[q.id]!==q.answer))return false;
    if(FONLY==="saved"&&!S.saved[q.id])return false;
    if(!kw)return true;
    const t=TIPS[q.id-1];
    return (q.no+" "+q.question+" "+t.join(" ")+" "+q.options[q.answer]).toLowerCase().includes(kw);
  });
  const box=$("#slist");if(!box)return;
  box.innerHTML=list.length?list.map(q=>`<div class="fitem">
    <div class="fhead">
      <b>Câu ${q.no} · Đáp án ${q.answer}</b>
      <button class="b" style="padding:5px 11px;min-height:34px;font-size:13px" onclick="go(${q.id-1})">Làm câu này →</button>
    </div>
    <div class="mu" style="margin-bottom:6px">${q.question}</div>
    ${tipBox(q.id,false)}
  </div>`).join(""):'<p class="mu" style="text-align:center;padding:18px 0">Không có câu nào khớp bộ lọc.</p>';
}

function studyView(){
  const traps=Q.filter(q=>isTrap(q.id)).length;
  return `<main class="main">
    <div class="cd">
      <div style="font-weight:750;font-size:16px;margin-bottom:10px">⚡ Tra cứu & Học thuộc Mẹo</div>
      <div class="sbox">
        <input class="inp" type="search" placeholder="Tìm từ khóa (VD: Talét, lượng, mặt 2...)" value="${FSEARCH.replace(/"/g,'&quot;')}" oninput="onSearch(this)">
        ${FSEARCH?`<button class="sclr" onclick="clearSearch()" aria-label="Xóa tìm kiếm">✕</button>`:""}
      </div>
      <div class="chips">
        <button class="chip ${FONLY==="all"?"on":""}" onclick="setFOnly('all')">Tất cả (${Q.length})</button>
        <button class="chip ${FONLY==="trap"?"on":""}" onclick="setFOnly('trap')">⚠️ Bẫy đề (${traps})</button>
        <button class="chip ${FONLY==="wrong"?"on":""}" onclick="setFOnly('wrong')">❌ Đã sai</button>
        <button class="chip ${FONLY==="saved"?"on":""}" onclick="setFOnly('saved')">★ Đã lưu (${nsv()})</button>
      </div>
      <div id="slist"></div>
    </div>
  </main>`;
}

function modesView(){
  const s=stats(),traps=Q.filter(q=>isTrap(q.id)).length,pct=s.n?Math.round(s.c/s.n*100):0;
  const cur=S.done?-1:S.order[S.pos];
  return `<main class="main">
    <div class="cd">
      <div style="font-weight:750;margin-bottom:10px">📊 Tiến độ của bạn</div>
      <div class="sgrid">
        <div class="sbox2"><strong>${s.n}/${Q.length}</strong><span>Đã làm</span></div>
        <div class="sbox2"><strong style="color:var(--ok)">${s.c}</strong><span>Đúng</span></div>
        <div class="sbox2"><strong style="color:var(--no)">${s.w}</strong><span>Sai</span></div>
        <div class="sbox2"><strong style="color:var(--ac)">${pct}%</strong><span>Chính xác</span></div>
      </div>
    </div>
    <div class="cd">
      <div style="font-weight:750">🎯 Chọn chế độ luyện tập</div>
      <div class="mgrid">
        <button class="b" onclick="mode('all')">📋 Theo thứ tự</button>
        <button class="b" onclick="mode('rand')">🔀 Trộn ngẫu nhiên</button>
        <button class="b" onclick="mode('wrong')">❌ Làm lại câu sai</button>
        <button class="b" onclick="mode('saved')">★ Câu đã lưu (${nsv()})</button>
        <button class="b" onclick="mode('todo')">⏳ Chưa làm (${Q.length-s.n})</button>
        <button class="b w" onclick="mode('trap')">⚠️ Ôn ${traps} câu bẫy</button>
      </div>
      <div class="rrow">
        <input id="r1" class="inp" type="number" inputmode="numeric" min="1" max="200" placeholder="Từ câu">
        <span>–</span>
        <input id="r2" class="inp" type="number" inputmode="numeric" min="1" max="200" placeholder="Đến câu">
        <button class="b p" onclick="mode('range')">Làm</button>
      </div>
    </div>
    <div class="cd">
      <div style="font-weight:750;margin-bottom:6px">🔢 Bảng 200 câu hỏi</div>
      <div class="legend" style="margin-top:0"><span>🟢 Đúng</span><span>🔴 Sai</span><span>★ Đã lưu</span><span style="color:var(--wn);font-weight:700">! Câu bẫy</span></div>
      ${gridHTML(cur)}
    </div>
    <div class="cd">
      ${RC?'<p style="margin:0 0 10px;font-weight:600">Xóa toàn bộ kết quả đã làm để luyện lại từ đầu?</p><div class="nv" style="margin-top:0"><button class="b" onclick="noRC()">Hủy</button><button class="b d" onclick="reset()">Xóa & làm lại</button></div>':'<button class="b d" style="width:100%" onclick="reset()">🗑️ Xóa kết quả, làm lại từ đầu</button>'}
    </div>
  </main>`;
}

function quizView(){
  if(S.done){
    const s=stats(),bad=Q.filter(q=>S.ans[q.id]&&S.ans[q.id]!==q.answer);
    return `<main class="main">
      <div class="cd">
        <div class="mu" style="text-align:center">Hoàn thành lượt luyện tập</div>
        <div class="big">${s.c}/${s.n}</div>
        <p class="mu" style="text-align:center;margin-top:0">Tỷ lệ đúng: <b>${s.n?Math.round(s.c/s.n*100):0}%</b></p>
        <div class="nv">
          <button class="b" onclick="nav(-1)">← Quay lại</button>
          <button class="b p" onclick="mode('wrong')">Làm lại câu sai (${bad.length})</button>
        </div>
      </div>
      <div class="cd">
        <div style="font-weight:750;margin-bottom:6px">❌ Các câu làm sai (${bad.length})</div>
        ${bad.map(q=>`<div class="w1"><b>Câu ${q.no}.</b> ${q.question}<br><span style="color:var(--no)">Bạn chọn ${S.ans[q.id]}</span> · <span style="color:var(--ok)">Đúng: ${q.answer}. ${q.options[q.answer]}</span>${tipBox(q.id,false)}</div>`).join("")||'<p class="mu">Xuất sắc! Không có câu sai nào.</p>'}
      </div>
    </main>`;
  }
  const q=Q[S.order[S.pos]],a=S.ans[q.id],last=S.pos===S.order.length-1;
  return `<main class="main has-qbar">
    <div class="cd" id="qcard">
      <div class="qmeta">
        <button class="qchip" onclick="openSheet(true)">Câu ${q.no}/200 ▾</button>
        <div class="qright">
          <span class="qpos">${S.pos+1}/${S.order.length}</span>
          <button class="starbtn ${S.saved[q.id]?"on":""}" onclick="sv(${q.id})">${S.saved[q.id]?"★ Đã lưu":"☆ Lưu"}</button>
        </div>
      </div>
      <p class="qtxt">${q.question}</p>
      ${L.map(l=>`<button class="o ${a?(l===q.answer?"ok":(l===a?"no":"")):""}" ${a?"disabled":""} onclick="pick('${l}')"><span class="ol">${l}</span><span class="ot">${q.options[l]}</span></button>`).join("")}
      ${!a?`<button class="hbtn" onclick="toggleHint()">${HINT?"🙈 Ẩn gợi ý thần chú":"💡 Quên rồi? Bấm xem gợi ý thần chú"}</button>`:""}
      ${!a&&HINT?tipBox(q.id,true):""}
      ${a?tipBox(q.id,false):""}
    </div>
    <p class="swipe-hint">Vuốt trái / phải trên thẻ câu hỏi để chuyển câu nhanh</p>
  </main>
  <div class="qbar">
    <div class="qbar-in">
      <button class="b" onclick="nav(-1)" ${S.pos?"":"disabled"}>← Trước</button>
      <button class="b" onclick="openSheet(true)" aria-label="Danh sách câu">☰ ${q.no}</button>
      <button class="b p" onclick="nav(1)">${last?"Kết thúc ✓":"Câu sau →"}</button>
    </div>
  </div>`;
}

function bindSwipe(){
  const c=$("#qcard");if(!c)return;
  let sx=0,sy=0;
  c.addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
  c.addEventListener("touchend",e=>{
    if(!sx)return;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    sx=0;
    if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0)nav(1);else if(S.pos>0)nav(-1);
    }
  },{passive:true});
}

function render(){
  const cur=S.done||S.view!=="quiz"?-1:S.order[S.pos];
  let body="";
  if(S.view==="study")body=studyView();
  else if(S.view==="mantra")body=mantraView();
  else if(S.view==="modes")body=modesView();
  else body=quizView();
  $("#app").innerHTML=headerHTML()+body+tabbarHTML()+sheetHTML(cur);
  if(S.view==="study")renderStudyList();
  if(S.view==="quiz"&&!S.done)bindSwipe();
  renderToast();
}

/* Desktop keyboard shortcuts */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||S.view!=="quiz"||S.done||SHEET)return;
  const k=e.key.toLowerCase();
  if(k==="arrowright")nav(1);
  else if(k==="arrowleft")nav(-1);
  else if(["a","b","c","d"].includes(k))pick(k.toUpperCase());
  else if(["1","2","3","4"].includes(k))pick(L[+k-1]);
  else if(k==="h"&&!S.ans[Q[S.order[S.pos]].id])toggleHint();
});

applyTheme();
render();
</script>
</body>
</html>

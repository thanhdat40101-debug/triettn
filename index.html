<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Triết Mác-Lênin">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b5bdb'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='34'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<title>Trắc nghiệm Triết học Mác - Lênin</title>
<style>
:root{
  --bg:#f2f5fa;--cd:#ffffff;--tx:#182030;--mu:#636d83;--bd:#dde3ef;
  --ac:#3b5bdb;--ac2:#edf2ff;--act:#2f49b8;
  --ok:#2b8a3e;--okb:#dbf5e2;--no:#c92a2a;--nob:#ffe3e3;
  --wn:#d9480f;--wnb:#fff4e6;--gl:rgba(255,255,255,.88);
  --sh:0 2px 10px rgba(20,30,60,.06);
  --sh2:0 -4px 18px rgba(20,30,60,.08);
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1219;--cd:#181d27;--tx:#edf0f7;--mu:#949fb5;--bd:#2a3142;
    --ac:#6c87ff;--ac2:#1f2842;--act:#9cb0ff;
    --ok:#51cf66;--okb:#143320;--no:#ff6b6b;--nob:#3b181b;
    --wn:#ff922b;--wnb:#332211;--gl:rgba(24,29,39,.9);
    --sh:0 2px 12px rgba(0,0,0,.35);--sh2:0 -4px 20px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1219;--cd:#181d27;--tx:#edf0f7;--mu:#949fb5;--bd:#2a3142;
  --ac:#6c87ff;--ac2:#1f2842;--act:#9cb0ff;
  --ok:#51cf66;--okb:#143320;--no:#ff6b6b;--nob:#3b181b;
  --wn:#ff922b;--wnb:#332211;--gl:rgba(24,29,39,.9);
  --sh:0 2px 12px rgba(0,0,0,.35);--sh2:0 -4px 20px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none;touch-action:manipulation}
button,input{font:inherit;color:inherit}

/* Sticky App Header */
.hdr{position:sticky;top:0;z-index:30;background:var(--gl);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.hdr-in{max-width:680px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand h1{font-size:16px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pill{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--bd);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--okb);border-color:transparent}
.pill.no{color:var(--no);background:var(--nob);border-color:transparent}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0}
.ibtn:active{transform:scale(.94)}
.pbar{height:3px;background:var(--bd);width:100%;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ac);transition:width .3s ease}

/* Main Container */
.main{max-width:680px;margin:0 auto;padding:12px 12px calc(86px + env(safe-area-inset-bottom,0px))}
.main.has-qbar{padding-bottom:calc(148px + env(safe-area-inset-bottom,0px))}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}

/* Quiz Meta Row */
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.qchip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--ac2);color:var(--act);border:0;font-size:13.5px;font-weight:700;cursor:pointer}
.qchip:active{transform:scale(.96)}
.qright{display:flex;align-items:center;gap:6px}
.qpos{font-size:13px;color:var(--mu);font-weight:600}
.starbtn{height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--bd);background:var(--cd);font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.starbtn.on{background:#fff3bf;border-color:#f59f00;color:#b86e00}
:root[data-theme="dark"] .starbtn.on{background:#3a2c0a;color:#ffd43b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .starbtn.on{background:#3a2c0a;color:#ffd43b}}

/* Question & Options */
.qtxt{font-size:17px;font-weight:650;line-height:1.45;margin:0 0 14px}
.o{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--cd);border:2px solid var(--bd);border-radius:14px;padding:12px 13px;margin-bottom:9px;cursor:pointer;min-height:52px;transition:transform .12s,border-color .15s,background .15s}
.o:active:not(:disabled){transform:scale(.985)}
.o:disabled{cursor:default}
.ol{width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;margin-top:1px}
.ot{flex:1;font-size:15.5px;line-height:1.42;padding-top:2px}
.o.ok{background:var(--okb);border-color:var(--ok);animation:pop .24s ease}
.o.ok .ol{background:var(--ok);border-color:var(--ok);color:#fff}
.o.no{background:var(--nob);border-color:var(--no);animation:shk .28s ease}
.o.no .ol{background:var(--no);border-color:var(--no);color:#fff}
@keyframes pop{50%{transform:scale(1.015)}}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Tip Box */
.hbtn{width:100%;margin-top:4px;padding:11px 14px;border-radius:12px;background:var(--ac2);color:var(--act);border:1.5px dashed var(--ac);font-weight:700;font-size:14.5px;cursor:pointer}
.hbtn:active{transform:scale(.98)}
.tip{background:var(--ac2);border-left:4px solid var(--ac);border-radius:12px;padding:11px 12px;margin-top:10px;font-size:14.5px}
.tip.warn{background:var(--wnb);border-left-color:var(--wn)}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px;font-size:13.5px}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;font-weight:700}
.tk{background:var(--cd);border:1px solid var(--bd);color:var(--tx)}
.ta{background:var(--okb);color:var(--ok);border:1px solid var(--ok)}
.th{line-height:1.48}
.swipe-hint{text-align:center;font-size:12.5px;color:var(--mu);margin:2px 0 0}

/* Buttons & Inputs */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);font-weight:650;font-size:14.5px;cursor:pointer;transition:transform .1s}
.b:active:not(:disabled){transform:scale(.97)}
.b.p{background:var(--ac);border-color:var(--ac);color:#fff}
.b.w{border-color:var(--wn);color:var(--wn);background:var(--wnb)}
.b.d{border-color:var(--no);color:var(--no);background:var(--nob)}
.b:disabled{opacity:.38;cursor:not-allowed}
.inp{width:100%;padding:11px 13px;min-height:44px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);outline:none;font-size:15px}
.inp:focus{border-color:var(--ac);background:var(--cd)}

/* Floating Quiz Action Bar (Mobile Thumb Zone) */
.qbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:35;padding:8px 12px;background:var(--gl);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd)}
.qbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1.25fr;gap:8px}
.qbar .b{min-height:46px;font-size:15px}

/* Fixed Bottom Tab Bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--cd);border-top:1px solid var(--bd);box-shadow:var(--sh2);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:62px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mu);font-size:11.5px;font-weight:650;cursor:pointer;position:relative;padding:4px 2px}
.tab .ic{font-size:20px;line-height:1.1}
.tab.on{color:var(--ac)}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--ac)}

/* Study / Search / Chips */
.sbox{position:relative;margin-bottom:10px}
.sbox .inp{padding-right:40px}
.sclr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;color:var(--mu);font-size:16px;cursor:pointer}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);font-size:13.5px;font-weight:650;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.fitem{border-top:1px solid var(--bd);padding:12px 0}
.fitem:first-child{border-top:0;padding-top:4px}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}

/* Mantras */
.mc{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.mc-t{font-size:15px;font-weight:750;color:var(--ac);margin-bottom:4px}
.mc-b{font-size:14.5px;line-height:1.5}

/* Modes & Stats Grid */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.sbox2{background:var(--bg);border-radius:12px;padding:10px 6px}
.sbox2 strong{display:block;font-size:20px;line-height:1.2}
.sbox2 span{font-size:12px;color:var(--mu)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.rrow .inp{width:84px;text-align:center;flex:1}

/* Question Number Grid */
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.g button{padding:0;min-height:42px;font-size:13.5px;font-weight:650;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;position:relative}
.g .ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.g .no{background:var(--nob);border-color:var(--no);color:var(--no)}
.g .cur{outline:2.5px solid var(--ac);outline-offset:1px}
.g .sv::after{content:"★";position:absolute;top:1px;right:3px;font-size:10px;color:#f59f00}
.g .tp::before{content:"!";position:absolute;top:1px;left:4px;font-size:10px;font-weight:800;color:var(--wn)}

/* Bottom Sheet Modal */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(10,15,28,.55);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease}
.sheet{width:100%;max-width:680px;max-height:82vh;background:var(--cd);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px);animation:slideUp .2s ease}
@media(min-width:681px){.sheet-bg{align-items:center}.sheet{border-radius:20px;max-height:78vh}}
.sh-hd{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh-hd h2{font-size:16px;margin:0}
.sh-bd{padding:12px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--mu);margin:8px 0 10px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px)}to{transform:translateY(0)}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:#1d2433;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.28);max-width:90vw;text-align:center;animation:fadeIn .15s}
:root[data-theme="dark"] .toast{background:#eef2ff;color:#111827}

/* Done Screen */
.big{font-size:44px;font-weight:800;text-align:center;line-height:1.1;margin:6px 0}
.mu{color:var(--mu);font-size:14px}
.w1{border-top:1px solid var(--bd);padding:12px 0;font-size:15px}
.nv{display:flex;gap:8px;margin-top:12px}.nv .b{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script>
const Q=[{"id":1,"no":1,"question":"Việc giải quyết mặt thứ 2 vấn đề cơ bản của triết học là căn cứ phân chia các học thuyết triết học thành?","options":{"A":"Chủ nghĩa duy thực và chủ nghĩa duy danh.","B":"Khả tri luận và bất khả tri luận.","C":"Chủ nghĩa duy vật và khả tri luận.","D":"Chủ nghĩa duy tâm và bất khả tri."},"answer":"B"},{"id":2,"no":2,"question":"Triết học tự nhiên đã được những thành tựu rực rỡ trong nền triết học nào?","options":{"A":"Triết học Trung Quốc Cổ đại.","B":"Triết học Ấn Độ cổ đại.","C":"Triết học Hy Lạp cổ đại.","D":"Triết học cổ điển Đức."},"answer":"C"},{"id":3,"no":3,"question":"Nền triết học cổ đại nào được gọi là “triết học tôn giáo”?","options":{"A":"Triết học Trung Quốc Cổ đại.","B":"Triết học Ấn Độ cổ đại.","C":"Triết học Hy Lạp cổ đại.","D":"Triết học Tây Âu thời trung cổ."},"answer":"B"},{"id":4,"no":4,"question":"Nền triết học nào mà đối tượng nghiên cứu tập trung vào các vấn đề chính trị, đạo đức, xã hội?","options":{"A":"Triết học Trung Quốc Cổ đại.","B":"Triết học Ấn Độ cổ đại.","C":"Triết học Hy Lạp cổ đại.","D":"Triết học Mác – Lênin"},"answer":"A"},{"id":5,"no":5,"question":"Thế giới quan bao gồm những hình thức cơ bản nào?","options":{"A":"Thế giới quan tôn giáo.","B":"Thế giới quan thần thoại.","C":"Thế giới quan triết học.","D":"Tất cả đáp án đều đúng."},"answer":"D"},{"id":6,"no":6,"question":"Ý thức có trước, vật chất có sau, ý thức quyết định vật chất. Đây là quan điểm của trường phái triết học nào?","options":{"A":"Duy vật.","B":"Duy tâm chủ quan.","C":"Duy tâm.","D":"Nhị nguyên."},"answer":"C"},{"id":7,"no":7,"question":"Vật chất có trước, ý thức có sau, vật chất quyết định ý thức. Đây là quan điểm của trường phái triết học nào?","options":{"A":"Duy vật.","B":"Duy tâm.","C":"Nhị nguyên","D":"Biện chứng."},"answer":"A"},{"id":8,"no":8,"question":"Chủ nghĩa duy vật quan niệm về mối quan hệ giữa vật chất và ý thức như sau?","options":{"A":"Vật chất có trước, ý thức có sau.","B":"Ý thức có trước, vật chất có sau.","C":"Vật chất và ý thức không có cái nào có trước, không có cái nào có sau.","D":"Vật chất và ý thức tồn tại song song."},"answer":"A"},{"id":9,"no":9,"question":"Ý thức, cảm giác của con người có trước, sinh ra và quyết định sự tồn tại của các sự vật. Quan điểm này thuộc trường phái triết học nào?","options":{"A":"Duy tâm chủ quan.","B":"Duy tâm.","C":"Duy tâm khách quan.","D":"Duy vật."},"answer":"A"},{"id":10,"no":10,"question":"Ý niệm tuyệt đối, tinh thần tuyệt đối là nguồn gốc sinh ra thế giới, đây là quan điểm của trường phái triết học nào?","options":{"A":"Duy vật.","B":"Duy tâm chủ quan.","C":"Duy tâm.","D":"Duy tâm khách quan."},"answer":"D"},{"id":11,"no":10,"question":"Cấp độ phát triển cao nhất của thế giới quan là?","options":{"A":"Thế giới quan Thần thoại","B":"Thế giới quan Tôn giáo","C":"Thế giới quan Triết học","D":"Thế giới quan Kinh nghiệm"},"answer":"C"},{"id":12,"no":11,"question":"Cấp độ phát triển cao nhất của thế giới quan là?","options":{"A":"Thế giới quan Thần thoại","B":"Thế giới quan Tôn giáo","C":"Thế giới quan Triết học","D":"Thế giới quan Kinh nghiệm"},"answer":"C"},{"id":13,"no":12,"question":"Hãy sắp xếp theo trình tự xuất hiện từ sớm nhất đến muộn nhất các hình thức thế giới quan sau?","options":{"A":"Tôn giáo - Thần thoại - Triết học.","B":"Thần thoại - Tôn giáo - Triết học.","C":"Triết học - Tôn giáo - Thần thoại.","D":"Thần thoại - Triết học - Tôn giáo."},"answer":"B"},{"id":14,"no":13,"question":"Triết học là gì?","options":{"A":"Triết học là tri thức về giới tự nhiên.","B":"Triết học là tri thức về tự nhiên và xã hội.","C":"Triết học là tri thức lý luận về con người về vật chất.","D":"Triết học là hệ thống lý luận chung nhất của con người về thế giới và vị trí con người trong thế giới."},"answer":"D"},{"id":15,"no":14,"question":"Triết học ra đời trong điều kiện nào?","options":{"A":"Xã hội phân chia thành giai cấp.","B":"Xuất hiện tầng lớp lao động trí óc.","C":"Tư duy của con người đạt trình độ tư duy khái quát cao, xã hội phân chia giai cấp và phân công lao động.","D":"Xuất hiện giai cấp tư sản."},"answer":"C"},{"id":16,"no":15,"question":"Mặt thứ hai trong vấn đề cơ bản của triết học là?","options":{"A":"Giữa vật chất và ý thức thì cái nào có trước, cái nào có sau, cái nào quyết định cái nào.","B":"Con người có khả năng nhận thức được thế giới hay không.","C":"Vấn đề mối quan hệ giữa vật chất và ý thức.","D":"Vấn đề giữa tư duy và tồn tại."},"answer":"B"},{"id":17,"no":16,"question":"Quan điểm của trường phái nào cho rằng: Vật chất có trước, ý thức có sau, vật chất sinh ra ý thức như gan tiết ra mật?","options":{"A":"Duy vật siêu hình.","B":"Duy vật biện chứng.","C":"Duy tâm chủ quan","D":"Duy tâm khách quan"},"answer":"A"},{"id":18,"no":17,"question":"Quan điểm nào cho rằng các sự vật hiện tượng, các quá trình khác nhau vừa tồn tại độc lập, vừa quy định, tác động qua lại, chuyển hoá lẫn nhau?","options":{"A":"Quan điểm siêu hình.","B":"Quan điểm biện chứng.","C":"Quan điểm duy tâm.","D":"Quan điểm duy thực."},"answer":"B"},{"id":19,"no":18,"question":"Quan điểm: “Vật chất và ý thức là hai nguyên thể đầu tiên cùng song song tồn tại” là quan điểm của trường phái triết học nào?","options":{"A":"Duy vật biện chứng.","B":"Duy tâm khách quan.","C":"Duy vật siêu hình.","D":"Nhị nguyên luận."},"answer":"D"},{"id":20,"no":19,"question":"Chức năng của triết học Mác- Lênin là?","options":{"A":"Giải thích cấu trúc thế giới.","B":"Xây dựng phương pháp cho các khoa học","C":"Xác lập thế giới quan, phương pháp luận chung nhất cho hoạt động nhận thức và thực tiễn.","D":"Giải thích các hiện tượng tâm linh."},"answer":"C"},{"id":21,"no":20,"question":"Nội dung Triết học Mác- Lênin bao gồm?","options":{"A":"Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật siêu hình.","B":"Chủ nghĩa duy tâm và chủ nghĩa duy vật.","C":"Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử.","D":"Chủ nghĩa duy vật và chủ nghĩa duy tâm."},"answer":"C"},{"id":22,"no":21,"question":"Trong triết học Mác- Lênin thì?","options":{"A":"Chủ nghĩa duy vật và Phép siêu hình gắn liền với nhau.","B":"Chủ nghĩa duy tâm và Phép biện chứng gắn liền với nhau.","C":"Chủ nghĩa duy vật và Phép biện chứng gắn liền với nhau.","D":"Chủ nghĩa duy vật và Chủ nghĩa duy tâm gắn liền với nhau."},"answer":"C"},{"id":23,"no":22,"question":"Các bộ phận lý luận cơ bản cấu thành chủ nghĩa Mác- Lênin?","options":{"A":"Triết học, Nghệ thuật, Chính trị","B":"Triết học, Chính trị, Tôn giáo","C":"Triết học Mác- Lênin; Kinh tế chính trị học Mác- Lênin; Chủ nghĩa xã hội khoa học","D":"Triết học Mác- Lênin; Kinh tế chính trị học Mác- Lênin"},"answer":"C"},{"id":24,"no":23,"question":"Khái niệm triết học (philosophia) thời Hy Lạp cổ đại nghĩa là gì?","options":{"A":"Nhân sinh quan của con người","B":"Con đường suy ngẫm để đi đến chân lý","C":"Thế giới quan của con người","D":"Yêu mến sự thông thái"},"answer":"D"},{"id":25,"no":24,"question":"Mặt thứ hai trong vấn đề cơ bản của triết học là gì?","options":{"A":"Cuộc sống con người sẽ đi về đâu?","B":"Con người có khả năng nhận thức được thế giới không?","C":"Con người hoàn toàn có khả năng nhận thức được thế giới.","D":"Cả ba đáp án trên."},"answer":"B"},{"id":26,"no":25,"question":"Về thực chất, chủ nghĩa nhị nguyên triết học có cùng bản chất với hệ thống triết lý nào?","options":{"A":"Chủ nghĩa duy tâm","B":"Chủ nghĩa xét lại triết học.","C":"Chủ nghĩa hoài nghi","D":"Chủ nghĩa tương đối."},"answer":"A"},{"id":27,"no":26,"question":"Đặc trưng cơ bản của phép biện chứng cổ đại là gì?","options":{"A":"Biện chứng duy tâm khách quan.","B":"Biện chứng duy vật, tự phát, chất phác","C":"Biện chứng duy vật khoa học.","D":"Biện chứng duy tâm chủ quan."},"answer":"B"},{"id":28,"no":27,"question":"Điểm chung trong quan niệm của các nhà triết học duy vật thời kỳ cổ đại về vật chất là?","options":{"A":"Đồng nhất vật chất với một hoặc vài vật thể cụ thể và xem chúng là khởi nguyên của thế giới.","B":"Đồng nhất vật chất với nguyên tử.","C":"Đồng nhất vật chất với thực tại khách quan.","D":"Đồng nhất vật chất với nước."},"answer":"A"},{"id":29,"no":28,"question":"Điều kiện kinh tế xã hội cho sự ra đời của triết học Mác- Lênin?","options":{"A":"Phương thức sản xuất tư bản chủ nghĩa được củng cố và phát triển.","B":"Giai cấp vô sản ra đời và trở thành lực lượng chính trị - xã hội độc lập.","C":"Trình độ khoa học tự nhiên, khoa học kỹ thuật phát triển.","D":"Tất cả đáp án."},"answer":"D"},{"id":30,"no":29,"question":"Ba phát minh lớn nhất của khoa học tự nhiên làm cơ sở cho sự ra đời tư duy biện chứng duy vật đầu thế kỷ XIX là những phát minh nào?","options":{"A":"Thuyết mặt trời làm trung tâm vũ trụ của Côpecních, định luật bảo toàn khối lượng của Lômônôxốp, Học thuyết tế bào.","B":"Định luật bảo toàn và chuyển hóa năng lượng, Học thuyết tế bào, Học thuyết tiến hóa.","C":"Phát hiện ra nguyên tử, Phát hiện ra điện tử, Định luật bảo toàn và chuyển hóa năng lượng.","D":"Phát hiện ra nguyên tử, Phát hiện ra điện tử, Học thuyết tế bào."},"answer":"B"},{"id":31,"no":30,"question":"Phát minh nào trong khoa học tự nhiên nửa đầu thế kỷ XIX vạch ra nguồn gốc tự nhiên của con người, chống lại quan điểm tôn giáo?","options":{"A":"Học thuyết tế bào.","B":"Học thuyết tiến hóa.","C":"Định luật bảo toàn và chuyển hóa năng lượng.","D":"Thuyết duy lý."},"answer":"B"},{"id":32,"no":31,"question":"Phát minh nào trong khoa học tự nhiên nửa đầu thế kỷ XIX vạch ra sự thống nhất giữa thế giới động vật và thực vật?","options":{"A":"Học thuyết tế bào.","B":"Học thuyết tiến hóa.","C":"Định luật bảo toàn và chuyển hóa năng lượng.","D":"Thuyết duy lý."},"answer":"A"},{"id":33,"no":32,"question":"Thực chất bước ngoặt cách mạng trong triết học do Mác và Ăngghen thực hiện là nội dung nào sau đây?","options":{"A":"Thống nhất giữa thế giới quan duy vật và phép biện chứng trong một hệ thống triết học.","B":"Thống nhất giữa triết học của Hêghen và triết học của Phoiơbắc.","C":"Phê phán triết học duy tâm của Hêghen.","D":"Khái quát các thành tựu triết học trước đó."},"answer":"A"},{"id":34,"no":33,"question":"Triết học Mác- Lênin nghiên cứu cái gì?","options":{"A":"Những quy luật chung nhất của tự nhiên, xã hội và tư duy trên lập trường duy vật biện chứng","B":"Quan hệ giữa người với người hình thành trong quá trình sản xuất, phân phối, trao đổi và tiêu dùng của cải vật chất.","C":"Những quy luật chính trị - xã hội của quá trình phát sinh, hình thành và phát triển của xã hội cộng sản chủ nghĩa.","D":"Các quy luật của tư duy."},"answer":"A"},{"id":35,"no":34,"question":"Cho rằng có thế giới tinh thần có trước, sinh ra và tồn tại độc lập bên cạnh thế giới vật chất sẽ rơi vào quan điểm triết học nào?","options":{"A":"Chủ nghĩa duy tâm.","B":"Chủ nghĩa duy vật biện chứng.","C":"Chủ nghĩa duy vật siêu hình.","D":"Chủ nghĩa hiện sinh."},"answer":"A"},{"id":36,"no":35,"question":"Nhà triết học nào cho nước là thực thể đầu tiên của thế giới và quan điểm đó thuộc lập trường triết học nào?","options":{"A":"Talét – Chủ nghĩa duy vật tự phát.","B":"Điđrô – Chủ nghĩa duy vật biện chứng.","C":"Béccơli – Chủ nghĩa duy tâm chủ quan.","D":"Platôn – Chủ nghĩa duy tâm khách quan."},"answer":"A"},{"id":37,"no":36,"question":"Nhà triết học nào coi lửa là thực thể đầu tiên của thế giới và đó là lập trường triết học nào?","options":{"A":"Đêmôcrit – Chủ nghĩa duy vật tự phát.","B":"Hêraclít – Chủ nghĩa duy vật tự phát.","C":"Platôn – Chủ nghĩa duy tâm khách quan.","D":"Anaximen – Chủ nghĩa duy vật tự phát."},"answer":"B"},{"id":38,"no":37,"question":"Nhà triết học nào cho nguyên tử và khoảng không là thực thể đầu tiên của thế giới và đó là lập trường triết học nào?","options":{"A":"Đêmôcrit – Chủ nghĩa duy vật tự phát.","B":"Hêraclít – Chủ nghĩa duy vật tự phát.","C":"Platôn – Chủ nghĩa duy tâm khách quan.","D":"Arixtốt – Chủ nghĩa duy vật tự phát."},"answer":"A"},{"id":39,"no":38,"question":"Đồng nhất vật chất nói chung với nguyên tử – một phần tử vật chất nhỏ nhất, đó là quan điểm của trường phái triết học nào?","options":{"A":"Chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII.","B":"Chủ nghĩa duy vật tự phát.","C":"Chủ nghĩa duy vật biện chứng.","D":"Chủ nghĩa duy tâm."},"answer":"A"},{"id":40,"no":39,"question":"Đặc điểm chung của quan niệm duy vật về vật chất ở thời kỳ cổ đại là gì?","options":{"A":"Đồng nhất vật chất nói chung với nguyên tử.","B":"Đồng nhất vật chất nói chung với một dạng cụ thể hữu hình, cảm tính của vật chất.","C":"Đồng nhất vật chất với khối lượng.","D":"Đồng nhất vật chất với ý thức."},"answer":"B"},{"id":41,"no":40,"question":"Thế nào là phương pháp siêu hình?","options":{"A":"Xem xét sự vật trong trạng thái cô lập, tách rời tuyệt đối","B":"Xem xét sự vật trong trạng thái tĩnh, không vận động phát triển","C":"Xem xét sự phát triển chỉ là sự tăng tiến thuần tuý về lượng, không có thay đổi về chất","D":"Tất cả các đáp án."},"answer":"D"},{"id":42,"no":41,"question":"Thế giới quan khoa học dựa trên lập trường triết học?","options":{"A":"Chủ nghĩa duy tâm chủ quan.","B":"Chủ nghĩa duy tâm khách quan.","C":"Chủ nghĩa duy vật.","D":"Tất cả đều đúng."},"answer":"C"},{"id":43,"no":42,"question":"Phát minh khoa học nào sau đây không phải là tiền đề khoa học tự nhiên của sự ra đời chủ nghĩa Mác?","options":{"A":"Định luật bảo toàn và chuyển hoá năng lượng.","B":"Thuyết tiến hoá của Dacuyn.","C":"Nguyên tử luận.","D":"Học thuyết tế bào."},"answer":"C"},{"id":44,"no":43,"question":"Ba phát minh trong khoa học tự nhiên: định luật bảo toàn và chuyển hoá năng lượng, học thuyết tế bào, học thuyết tiến hoá chứng minh thế giới vật chất có tính chất gì?","options":{"A":"Tính tách rời của thế giới vật chất.","B":"Tính biện chứng của sự vận động và phát triển của thế giới vật chất.","C":"Tính không tồn tại thực của thế giới vật chất.","D":"Tính tĩnh tại của thế giới vật chất."},"answer":"B"},{"id":45,"no":44,"question":"Phép biện chứng cổ đại là?","options":{"A":"Biện chứng duy tâm.","B":"Biện chứng tự phát, chất phác.","C":"Biện chứng duy vật khoa học.","D":"Biện chứng chủ quan."},"answer":"B"},{"id":46,"no":45,"question":"Xác định câu trả lời thuộc chủ nghĩa duy tâm? Mâu thuẫn biện chứng là…?","options":{"A":"Sự liên tác động lẫn nhau giữa các mặt, thuộc tính, có khuynh hướng biến đổi trái ngược nhau, tồn tại khách quan trong sự vật tạo thành mâu thuẫn biện chứng","B":"Là khuynh hướng biến đổi trái ngược nhau trong sự liên hệ tác động qua lại của các mặt do con người tạo ra","C":"Là sự tác động lẫn nhau của các mặt có sự khác nhau một cách khách quan, phổ biến giữa các sự vật hiện tượng","D":"Là sự liên hệ phổ biến của các mặt, các thuộc tính trong sự vật hiện tượng, trong sự thống nhất với nhau"},"answer":"B"},{"id":47,"no":46,"question":"Hãy chỉ ra luận điểm thuộc lập trường duy vật siêu hình trong các luận điểm sau?","options":{"A":"Mâu thuẫn là nguồn gốc, động lực của mọi sự vận động, phát triển","B":"Phủ định của phủ định là sự loại bỏ hoàn toàn sự vật cũ","C":"Nhân quả là mối liên hệ có tính chủ quan, do con người xác lập","D":"Nhận thức chẳng qua chỉ là phức hợp các cảm giác của con người, do đó không có cảm giác không có nhận thức"},"answer":"B"},{"id":48,"no":47,"question":"Đồng nhất vật chất nói chung với một vật thể hữu hình, cảm tính đang tồn tại trong thế giới là quan điểm của trường phái triết học nào?","options":{"A":"Chủ nghĩa duy tâm","B":"Chủ nghĩa duy vật tự phát","C":"Chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII","D":"Chủ nghĩa duy vật biện chứng"},"answer":"C"},{"id":49,"no":48,"question":"Đồng nhất vật chất nói chung với nguyên tử là quan điểm của trường phái triết học nào?","options":{"A":"Chủ nghĩa duy tâm","B":"Chủ nghĩa duy vật tự phát","C":"Chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII","D":"Chủ nghĩa duy vật biện chứng"},"answer":"C"},{"id":50,"no":49,"question":"Hạn chế chung của quan niệm duy vật về vật chất ở thời kỳ cổ đại là?","options":{"A":"Mang tính duy tâm chủ quan","B":"Mang tính duy vật, tự phát, chất phác, ngây thơ","C":"Có tính duy vật máy móc, siêu hình","D":"Mang tính duy tâm, thần bí"},"answer":"B"},{"id":51,"no":50,"question":"Mặt tích cực trong quan niệm duy vật về vật chất thời kỳ cổ đại?","options":{"A":"Chống quan niệm duy tâm, tôn giáo","B":"Thúc đẩy chủ nghĩa duy tâm khách quan phát triển","C":"Thúc đẩy chủ nghĩa duy tâm chủ quan phát triển","D":"Xây dựng niềm tin của con người vào Thượng đế"},"answer":"A"},{"id":52,"no":51,"question":"Đỉnh cao nhất của tư tưởng duy vật thời cổ đại về vật chất là?","options":{"A":"Quan niệm Âm dương, ngũ hành","B":"Quan niệm về lửa của Heraclit","C":"Quan niệm về nước của Talet","D":"Quan niệm về nguyên tử của Lơxíp và Democrit"},"answer":"D"},{"id":53,"no":52,"question":"Quan điểm sau đây thuộc trường phái triết học nào: Cái gì mà con người cảm giác được là vật chất?","options":{"A":"Chủ nghĩa duy vật siêu hình","B":"Chủ nghĩa duy vật biện chứng","C":"Chủ nghĩa duy tâm khách quan","D":"Chủ nghĩa duy tâm chủ quan"},"answer":"A"},{"id":54,"no":53,"question":"Khi nói vật chất là cái được cảm giác của chúng ta chép lại, phản ánh lại, về mặt nhận thức luận, Lênin muốn khẳng định điều gì?","options":{"A":"Vật chất có trước, ý thức có sau","B":"Con người không đủ khả năng nhận thức thế giới","C":"Con người có khả năng nhận thức thế giới","D":"Nhận thức con người có giới hạn"},"answer":"C"},{"id":55,"no":54,"question":"Đâu là quan niệm của chủ nghĩa duy vật biện chứng về phản ánh?","options":{"A":"Phản ánh là thuộc tính vốn có của mọi dạng vật chất","B":"Phản ánh là đặc tính riêng của một dạng vật chất có tổ chức cao nhất là bộ não con người","C":"Phản ánh là năng lực do Thượng đế ban cho","D":"Phản ánh không có thật, do con người tưởng tượng ra"},"answer":"B"},{"id":56,"no":55,"question":"Hai mệnh đề “Vận động là thuộc tính cố hữu của vật chất” và “Vận động là phương thức tồn tại của vật chất” được hiểu là:","options":{"A":"Vật chất tồn tại bằng cách vận động.","B":"Vật chất biểu hiện sự tồn tại cụ thể, đa dạng thông qua vận động.","C":"Không thể có vận động phi vật chất cũng như không thể có vật chất không vận động.","D":"Tất cả các đáp án"},"answer":"D"},{"id":57,"no":56,"question":"Nguyên tắc phương pháp luận rút ra từ mối quan hệ giữa vật chất và ý thức theo quan điểm duy vật biện chứng là gì?","options":{"A":"Nguyên tắc khách quan.","B":"Nguyên tắc toàn diện.","C":"Nguyên tắc lịch sử cụ thể.","D":"Nguyên tắc phát triển."},"answer":"A"},{"id":58,"no":57,"question":"Lựa chọn mệnh đề đúng trong số các mệnh đề được liệt kê dưới đây:","options":{"A":"Trong một sự vật có thể tồn tại nhiều hình thức vận động.","B":"Mỗi sự vật thường được đặc trưng bởi một hình thức vận động cao nhất mà nó có.","C":"Hình thức vận động cao hơn có thể bao hàm trong nó những hình thức vận động thấp hơn.","D":"Tất cả các đáp án"},"answer":"D"},{"id":59,"no":58,"question":"Tục ngữ Việt Nam có câu: “Cha mẹ sinh con, trời sinh tính”. Quan điểm trên thuộc lập trường triết học nào?","options":{"A":"Chủ nghĩa duy vật.","B":"Chủ nghĩa duy tâm khách quan.","C":"Chủ nghĩa duy tâm chủ quan.","D":"Tất cả các đáp án của câu này đều sai."},"answer":"B"},{"id":60,"no":59,"question":"Chủ nghĩa duy vật bao gồm những hình thức nào?","options":{"A":"Chủ nghĩa duy vật cổ đại.","B":"Chủ nghĩa duy vật siêu hình.","C":"Chủ nghĩa duy vật biện chứng.","D":"Tất cả các đáp án trên."},"answer":"D"},{"id":61,"no":60,"question":"Nhân tố cơ bản, trực tiếp tạo thành nguồn gốc xã hội của ý thức?","options":{"A":"Lao động và ngôn ngữ","B":"Lao động trí óc và lao động chân tay","C":"Lao động và nghiên cứu khoa học","D":"Lao động và thực tiễn"},"answer":"A"},{"id":62,"no":61,"question":"Quan điểm của triết học Mác-Lênin về bản chất của ý thức?","options":{"A":"Ý thức là sự phản ánh năng động, sáng tạo hiện thực khách quan","B":"Ý thức mang tính trực giác","C":"Ý thức phản ánh hiện thực khách quan một cách nguyên xi","D":"Ý thức của con người do Thượng đế ban cho"},"answer":"A"},{"id":63,"no":62,"question":"Đảng Cộng sản Việt Nam đã khẳng định: \"Mọi chủ trương, đường lối của Đảng phải xuất phát từ thực tế, tôn trọng quy luật khách quan.\" Quan điểm này xuất phát từ?","options":{"A":"Nguyên lý về mối liên hệ phổ biến","B":"Nguyên lý về sự phát triển","C":"Mối quan hệ biện chứng giữa vật chất và ý thức","D":"Mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng"},"answer":"C"},{"id":64,"no":63,"question":"Hãy xác định câu trả lời đúng theo quan điểm Chủ nghĩa duy vật biện chứng về vai trò của ý thức?","options":{"A":"Ý thức tự nó chỉ làm thay đổi tư tưởng. Như vậy ý thức hoàn toàn không có tác dụng gì đối với thực tiễn.","B":"Ý thức là phản ánh năng động, sáng tạo thực tại khách quan và đồng thời có tác động trở lại mạnh mẽ thực tại đó thông qua hoạt động thực tiễn của con người.","C":"Ý thức là cái phụ thuộc vào nguồn gốc sinh ra nó. Vì thế chỉ có vật chất mới là cái năng động, tích cực.","D":"Ý thức là cái quyết định vật chất. Vật chất chỉ là cái thụ động."},"answer":"B"},{"id":65,"no":64,"question":"Trong nhận thức và hoạt động thực tiễn nếu tuyệt đối hóa vai trò của vật chất thì sẽ mắc phải sai lầm nào?","options":{"A":"Chủ quan duy ý chí","B":"Nguỵ biện","C":"Giáo điều, phiến diện","D":"Toàn diện"},"answer":"C"},{"id":66,"no":65,"question":"Tính khách quan của mối liên hệ thể hiện như thế nào?","options":{"A":"Là mối liên hệ vốn có do Thượng đế sắp đặt","B":"Là mối liên hệ khách quan, vốn có của sự vật hiện tượng, tồn tại bên ngoài ý thức, cơ sở của nó là tính thống nhất vật chất của thế giới","C":"Là mối liên hệ chủ quan, phụ thuộc vào ý thức con người","D":"Là mối liên hệ do cá nhân đặt ra"},"answer":"B"},{"id":67,"no":66,"question":"Từ nguyên lý về mối liên hệ phổ biến của phép biện chứng duy vật, rút ra được nguyên tắc phương pháp luận nào?","options":{"A":"quan điểm phát triển","B":"quan điểm lịch sử cụ thể","C":"quan điểm toàn diện","D":"quan điểm toàn diện, lịch sử cụ thể"},"answer":"D"},{"id":68,"no":67,"question":"Theo quan điểm của chủ nghĩa duy vật biện chứng, đáp án nào sai?","options":{"A":"Phát triển là quá trình vận động từ thấp đến cao, từ kém hoàn thiện đến hoàn thiện hơn, từ chất cũ đến chất mới ở trình độ cao hơn.","B":"Phát triển là sự tăng lên hoặc giảm đi về mặt lượng, chỉ là sự tuần hoàn, lặp đi, lặp lại mà không có sự thay đổi về chất.","C":"Phát triển là vận động nhưng không phải mọi vận động đều là phát triển.","D":"Đặc điểm chung của sự phát triển là tính tiến lên theo đường xoáy ốc, có kế thừa, có sự dường như lặp lại sự vật, hiện tượng cũ nhưng trên cơ sở cao hơn."},"answer":"B"},{"id":69,"no":68,"question":"Định nghĩa về vật chất của Lênin được nêu trong tác phẩm nào?","options":{"A":"Biện chứng của tự nhiên.","B":"Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán.","C":"Bút ký triết học.","D":"Nhà nước và cách mạng."},"answer":"B"},{"id":70,"no":69,"question":"Định nghĩa vật chất của Lênin bao quát đặc tính quan trọng nhất của mọi dạng vật chất để phân biệt với ý thức, đó là đặc tính gì?","options":{"A":"Thực tại khách quan độc lập với ý thức của con người.","B":"Vận động.","C":"Có khối lượng và quảng tính.","D":"Tồn tại."},"answer":"A"},{"id":71,"no":70,"question":"Định nghĩa vật chất của Lênin có ý nghĩa gì?","options":{"A":"Khẳng định tính thứ nhất của vật chất.","B":"Cho phép xác định vật chất trong lĩnh vực xã hội.","C":"Chống lại chủ nghĩa duy tâm và thuyết không thể biết.","D":"Tất cả các đáp án"},"answer":"D"},{"id":72,"no":71,"question":"Theo Ăngghen, có thể chia vận động thành?","options":{"A":"4 hình thức vận động cơ bản.","B":"5 hình thức vận động cơ bản.","C":"6 hình thức vận động cơ bản.","D":"7 hình thức vận động cơ bản."},"answer":"B"},{"id":73,"no":72,"question":"Nội dung của mối quan hệ biện chứng giữa vật chất và ý thức là?","options":{"A":"Vật chất có trước, ý thức có sau, vật chất quyết định ý thức.","B":"Vật chất có trước, ý thức có sau, vật chất quyết định ý thức, ý thức cũng có thể quyết định vật chất.","C":"Vật chất có trước, ý thức có sau, vật chất quyết định ý thức, ý thức có thể tác động trở lại vật chất thông qua hoạt động thực tiễn của con người.","D":"Vật chất và ý thức có vai trò như nhau."},"answer":"C"},{"id":74,"no":73,"question":"Trường phái triết học nào cho rằng vận động bao gồm mọi sự biến đổi nói chung, là phương thức tồn tại của vật chất?","options":{"A":"Chủ nghĩa duy vật siêu hình.","B":"Chủ nghĩa duy vật biện chứng.","C":"Chủ nghĩa duy tâm chủ quan.","D":"Chủ nghĩa duy tâm khách quan."},"answer":"B"},{"id":75,"no":74,"question":"Khi nói vật chất là cái được cảm giác của chúng ta chép lại, chụp lại, phản ánh lại, về mặt nhận thức luận, Lênin muốn khẳng định điều gì?","options":{"A":"Cảm giác, ý thức của chúng ta là sự phản ánh thế giới khách quan.","B":"Cảm giác, ý thức của chúng ta không thể phản ánh thế giới vật chất.","C":"Cảm giác, ý thức phụ thuộc thụ động vào thế giới vật chất.","D":"Cảm giác, ý thức là nguồn gốc của thế giới vật chất."},"answer":"A"},{"id":76,"no":75,"question":"Theo chủ nghĩa duy vật biện chứng, ý thức là?","options":{"A":"Hình ảnh chủ quan của thế giới khách quan.","B":"Hình ảnh phản ánh sự vận động nói chung.","C":"Một chức năng của bộ óc con người.","D":"Sản phẩm của bộ óc, như gan tiết ra mật."},"answer":"A"},{"id":77,"no":76,"question":"Theo chủ nghĩa duy vật biện chứng, nguồn gốc của vận động là?","options":{"A":"Ở bên ngoài sự vật, hiện tượng do sự tương tác hay do sự tác động giữa các yếu tố khác nhau gây ra.","B":"Do ý thức quy định.","C":"Ở trong bản thân sự vật hiện tượng do sự tác động của các mặt, các yếu tố trong sự vật hiện tượng gây ra.","D":"Do Thượng đế sinh ra"},"answer":"C"},{"id":78,"no":77,"question":"Theo chủ nghĩa duy vật biện chứng, vật chất với tư cách là phạm trù triết học có đặc tính gì?","options":{"A":"Vô hạn, vô tận, tồn tại vĩnh viễn, độc lập với ý thức.","B":"Có giới hạn.","C":"Tồn tại cảm tính.","D":"Có sinh ra và mất đi."},"answer":"A"},{"id":79,"no":78,"question":"Trong mối quan hệ giữa vận động và đứng im thì vận động là?","options":{"A":"Tương đối.","B":"Tuyệt đối.","C":"Vĩnh viễn.","D":"Tạm thời"},"answer":"B"},{"id":80,"no":79,"question":"Theo Ăngghen, hình thức vận động nào nói lên sự thay đổi vị trí của vật thể trong không gian?","options":{"A":"Vận động cơ học.","B":"Vận động vật lý.","C":"Vận động hóa học.","D":"Vận động sinh học."},"answer":"A"},{"id":81,"no":80,"question":"Theo Ăngghen, hình thức vận động nào nói lên sự tương tác của các phân tử, các hạt cơ bản?","options":{"A":"Vận động cơ học.","B":"Vận động vật lý.","C":"Vận động hóa học.","D":"Vận động sinh học."},"answer":"B"},{"id":82,"no":81,"question":"Theo Ăngghen, hình thức vận động nào nói lên sự trao đổi chất giữa cơ thể sống với môi trường?","options":{"A":"Vận động cơ học.","B":"Vận động vật lý.","C":"Vận động hóa học.","D":"Vận động sinh học."},"answer":"D"},{"id":83,"no":82,"question":"Theo Ăngghen, hình thức vận động đặc trưng của con người và xã hội loài người là?","options":{"A":"Vận động cơ học.","B":"Vận động vật lý.","C":"Vận động xã hội.","D":"Vận động sinh học."},"answer":"C"},{"id":84,"no":83,"question":"Hình thức vận động đa dạng, phức tạp nhất trong thế giới vật chất là?","options":{"A":"Vận động xã hội.","B":"Các phản ứng hạt nhân.","C":"Sự tiến hóa các loài.","D":"Vận động sinh học."},"answer":"A"},{"id":85,"no":84,"question":"Theo chủ nghĩa duy vật biện chứng, vai trò của ý thức đối với vật chất là gì?","options":{"A":"Ý thức sinh ra vật chất.","B":"Ý thức và vật chất không có mối quan hệ với nhau.","C":"Ý thức có vai trò quyết định đối với vật chất.","D":"Ý thức có thể tác động trở lại vật chất thông qua hoạt động thực tiễn của con người."},"answer":"D"},{"id":86,"no":85,"question":"Từ quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa vật chất và ý thức, rút ra được nguyên tắc?","options":{"A":"Phát huy tính năng động chủ quan.","B":"Xuất phát từ thực tế khách quan.","C":"Coi trọng yếu tố chủ quan.","D":"Xuất phát từ thực tế khách quan, phát huy tính năng động chủ quan"},"answer":"D"},{"id":87,"no":86,"question":"Bệnh chủ quan duy ý chí biểu hiện như thế nào?","options":{"A":"Chỉ căn cứ vào kinh nghiệm lịch sử để định ra chiến lược và sách lược cách mạng.","B":"Chỉ căn cứ vào quy luật khách quan để định ra chiến lược và sách lược cách mạng.","C":"Chỉ căn cứ vào kinh nghiệm của các nước khác để định ra chiến lược và sách lược cách mạng.","D":"Chỉ căn cứ vào mong muốn chủ quan để định ra chiến lược và sách lược cách mạng."},"answer":"D"},{"id":88,"no":87,"question":"“Mọi chủ trương, đường lối của Đảng phải xuất phát từ thực tế, tôn trọng quy luật khách quan”. Quan điểm này xuất phát từ:","options":{"A":"Nguyên lý mối liên hệ phổ biến.","B":"Nguyên lý về sự phát triển.","C":"Mối quan hệ biện chứng giữa vật chất và ý thức.","D":"Mối quan hệ biện chứng cơ sở hạ tầng quyết định ý thức xã hội."},"answer":"C"},{"id":89,"no":88,"question":"Theo chủ nghĩa duy vật biện chứng, ý thức là?","options":{"A":"Là hình ảnh của thế giới khách quan.","B":"Là hình ảnh phản ánh sự vận động và phát triển của thế giới khách quan.","C":"Là một phần chức năng của bộ óc con người.","D":"Là sự phản ánh năng động, sáng tạo hiện thực khách quan của não bộ con người."},"answer":"D"},{"id":90,"no":89,"question":"Sự khác nhau cơ bản giữa phản ánh ý thức với các hình thức phản ánh khác của thế giới vật chất là ở chỗ nào?","options":{"A":"Tính thụ động trong quá trình phản ánh.","B":"Tính định hướng, tích cực, sáng tạo.","C":"Tính quy định bởi vật phản ánh.","D":"Tất cả các đáp án"},"answer":"B"},{"id":91,"no":90,"question":"Ăngghen viết: “[…] là điều kiện cơ bản đầu tiên của toàn bộ đời sống loài người, và như thế đến một mức mà trên một ý nghĩa nào đó, chúng ta phải nói: […] đã sáng tạo ra bản thân con người”. Hãy điền một từ vào chỗ trống để hoàn thiện câu trên?","options":{"A":"Lao động…lao động","B":"Vật chất…vật chất","C":"Tự nhiên…tự nhiên","D":"Sản xuất…sản xuất"},"answer":"A"},{"id":92,"no":91,"question":"Theo cách phân chia các hình thức vận động của Ăngghen, hình thức vận động nào là thấp nhất?","options":{"A":"Vận động cơ học.","B":"Vận động vật lý.","C":"Vận động hoá học.","D":"Vận động xã hội."},"answer":"A"},{"id":93,"no":92,"question":"Trường phái triết học nào cho vận động là tuyệt đối, đứng im là tương đối?","options":{"A":"Chủ nghĩa duy vật tự phát.","B":"Chủ nghĩa duy vật biện chứng.","C":"Chủ nghĩa duy tâm khách quan.","D":"Chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII."},"answer":"B"},{"id":94,"no":93,"question":"Chủ nghĩa duy tâm tìm nguồn gốc của sự thống nhất của thế giới ở cái gì?","options":{"A":"Ở tính vật chất của thế giới.","B":"Ở ý niệm tuyệt đối hoặc ở ý thức của con người.","C":"Ở sự vận động và chuyển hóa lẫn nhau của thế giới.","D":"Ở vật chất."},"answer":"B"},{"id":95,"no":94,"question":"Thuộc tính đặc trưng của vật chất theo chủ nghĩa Mác- Lênin là gì?","options":{"A":"Là một phạm trù triết học.","B":"Là tồn tại.","C":"Là tất cả những gì bên ngoài con người.","D":"Là thực tại khách quan tồn tại bên ngoài, không lệ thuộc vào cảm giác."},"answer":"D"},{"id":96,"no":95,"question":"Theo chủ nghĩa duy vật biện chứng, đứng im là?","options":{"A":"Biểu hiện của trạng thái không phát triển.","B":"Biểu hiện của trạng thái vận động trong thăng bằng.","C":"Biểu hiện của trạng thái không vận động.","D":"Biểu hiện của trạng thái đứng im tuyệt đối"},"answer":"B"},{"id":97,"no":96,"question":"Theo chủ nghĩa duy vật biện chứng, ý thức tác động trở lại vật chất thông qua?","options":{"A":"Sự phê phán.","B":"Hoạt động thực tiễn.","C":"Sức mạnh của tư duy","D":"Sự hỗ trợ của Thượng đế"},"answer":"B"},{"id":98,"no":97,"question":"Quan điểm của chủ nghĩa duy tâm về nguồn gốc của ý thức?","options":{"A":"Là sự phản ánh của hiện thực khách quan.","B":"Là thuộc tính của bộ não người, do não người tiết ra.","C":"Ý thức là sản phẩm của thần linh, Thượng Đế","D":"Ý thức tự nó hình thành, không do ai sinh ra"},"answer":"C"},{"id":99,"no":98,"question":"Theo chủ nghĩa duy vật biện chứng, nguồn gốc tự nhiên của ý thức gồm những yếu tố nào?","options":{"A":"Bộ óc con người.","B":"Bộ óc con người và thế giới bên ngoài tác động vào bộ óc con người.","C":"Lao động của con người.","D":"Tất cả đáp án"},"answer":"B"},{"id":100,"no":99,"question":"Nguồn gốc xã hội của ý thức là yếu tố nào?","options":{"A":"Bộ óc con người.","B":"Sự tác động của thế giới bên ngoài vào bộ óc con người.","C":"Lao động và ngôn ngữ của con người.","D":"Lao động và phản ánh."},"answer":"C"},{"id":101,"no":100,"question":"Theo Mác, yếu tố đầu tiên đảm bảo cho sự tồn tại của con người là gì?","options":{"A":"Làm khoa học.","B":"Sáng tạo nghệ thuật.","C":"Lao động.","D":"Hoạt động chính trị- xã hội."},"answer":"C"},{"id":102,"no":101,"question":"Theo chủ nghĩa duy vật biện chứng, quá trình hình thành ý thức là quá trình nào?","options":{"A":"Quá trình dạy và học","B":"Quá trình nghiên cứu và sáng tạo thuần túy trong tư duy con người","C":"Quá trình kinh tế","D":"Quá trình phản ánh sáng tạo và cải tạo thế giới"},"answer":"D"},{"id":103,"no":102,"question":"Để phản ánh hiện thực khách quan, con người cần có cái gì?","options":{"A":"Công cụ lao động.","B":"Cơ quan cảm giác.","C":"Ngôn ngữ.","D":"Công cụ sản xuất."},"answer":"B"},{"id":104,"no":103,"question":"Theo chủ nghĩa duy vật biện chứng, nguồn gốc trực tiếp và quan trọng nhất quyết định sự ra đời và phát triển của ý thức là gì?","options":{"A":"Sự tác động của tự nhiên vào bộ óc con người.","B":"Lao động, thực tiễn xã hội.","C":"Bộ não người và hoạt động của nó.","D":"Công cụ lao động."},"answer":"B"},{"id":105,"no":104,"question":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về bản chất của ý thức?","options":{"A":"Ý thức là thực thể độc lập với vật chất.","B":"Ý thức là sự phản ánh nguyên xi hiện thực khách quan vào bộ óc con người.","C":"Ý thức là sự phản ánh sáng tạo hiện thực khách quan vào bộ óc con người.","D":"Ý thức là sản phẩm của mọi dạng vật chất."},"answer":"C"},{"id":106,"no":105,"question":"Quan niệm của chủ nghĩa duy vật biện chứng về tính sáng tạo của ý thức là thế nào?","options":{"A":"Ý thức tạo ra vật chất.","B":"Ý thức tạo ra sự vật trong hiện thực.","C":"Ý thức không sinh, không diệt.","D":"Ý thức tạo ra hình ảnh mới về sự vật trong tư duy."},"answer":"D"},{"id":107,"no":106,"question":"Theo chủ nghĩa duy vật biện chứng, trong kết cấu của ý thức thì yếu tố nào là cơ bản và cốt lõi nhất?","options":{"A":"Tri thức.","B":"Tình cảm.","C":"Niềm tin","D":"Ý chí."},"answer":"A"},{"id":108,"no":107,"question":"Theo chủ nghĩa duy vật biện chứng, kết cấu theo chiều dọc của ý thức gồm những yếu tố nào?","options":{"A":"Tự ý thức; tiềm thức; vô thức","B":"Tri thức; niềm tin; ý chí","C":"Tự ý thức; tiềm thức; vô thức; trí tuệ nhân tạo","D":"Ý thức; tự ý thức"},"answer":"A"},{"id":109,"no":108,"question":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa vật chất và ý thức?","options":{"A":"Ý thức do vật chất quyết định","B":"Ý thức tác động đến vật chất","C":"Ý thức quyết định vật chất và vật chất tác động lại ý thức","D":"Ý thức do vật chất quyết định, nhưng có tính độc lập tương đối và tác động trở lại vật chất thông qua hoạt động thực tiễn"},"answer":"D"},{"id":110,"no":109,"question":"Thế giới vô cơ, thế giới sinh vật và xã hội loài người là 3 lĩnh vực hoàn toàn khác biệt nhau, không quan hệ gì với nhau là quan điểm?","options":{"A":"Duy vật siêu hình.","B":"Duy vật biện chứng.","C":"Duy tâm khách quan.","D":"Duy tâm chủ quan."},"answer":"A"},{"id":111,"no":110,"question":"Ăngghen viết: “…đã sáng tạo ra bản thân con người”. Hãy chọn từ thích hợp điền vào dấu … để hoàn thiện câu trên?","options":{"A":"Vật chất.","B":"Tự nhiên.","C":"Lao động","D":"Ý thức."},"answer":"C"},{"id":112,"no":111,"question":"Quan điểm “Tính năng động chủ quan của ý thức con người muốn phát huy có hiệu quả bao giờ cũng phải dựa trên cơ sở vật chất” thuộc lập trường triết học nào dưới đây?","options":{"A":"Chủ nghĩa Duy vật biện chứng.","B":"Chủ nghĩa Duy vật siêu hình.","C":"Chủ nghĩa Duy tâm chủ quan.","D":"Nhị nguyên luận."},"answer":"A"},{"id":113,"no":112,"question":"Quan điểm “Mọi tri thức, dù trực tiếp hay gián tiếp, dù ở trình độ cao hay thấp, xét đến cùng đều dựa trên cơ sở thực tiễn” thuộc lập trường triết học nào?","options":{"A":"Chủ nghĩa Duy vật biện chứng.","B":"Chủ nghĩa Duy vật siêu hình.","C":"Nhị nguyên luận.","D":"Chủ nghĩa Duy tâm chủ quan."},"answer":"A"},{"id":114,"no":113,"question":"Phép biện chứng duy vật có mấy nguyên lý cơ bản?","options":{"A":"Một nguyên lý.","B":"Hai nguyên lý.","C":"Ba nguyên lý.","D":"Bốn nguyên lý."},"answer":"B"},{"id":115,"no":114,"question":"Nguyên lý cơ bản của phép biện chứng duy vật là nguyên lý nào?","options":{"A":"Nguyên lý về sự tồn tại khách quan của vật chất và Nguyên lý về sự tồn tại chủ quan của ý thức.","B":"Nguyên lý về sự vận động và Nguyên lý về sự đứng im.","C":"Nguyên lý về mối liên hệ phổ biến và Nguyên lý về sự phát triển.","D":"Nguyên lý về tính khách quan của thế giới vật chất và Nguyên lý về tính chủ quan của tinh thần."},"answer":"C"},{"id":116,"no":115,"question":"Cơ sở lý luận của quan điểm (nguyên tắc) toàn diện là nguyên lý nào?","options":{"A":"Nguyên lý về sự phát triển.","B":"Nguyên lý về mối liên hệ phổ biến.","C":"Nguyên lý về sự tồn tại khách quan của thế giới vật chất","D":"Nguyên lý về tính đa dạng, phong phú của thế giới vật chất"},"answer":"B"},{"id":117,"no":116,"question":"Xem xét sự vật theo quan điểm (nguyên tắc) toàn diện yêu cầu chúng ta phải như thế nào?","options":{"A":"Chỉ xem xét mối liên hệ cơ bản và tất yếu trong quá trình tồn tại và phát triển của sự vật.","B":"Chỉ xem xét các mối liên hệ cơ bản trong quá trình tồn tại và phát triển của sự vật.","C":"Phải xem xét tất cả các mối liên hệ trong quá trình tồn tại và phát triển của sự vật.","D":"Phải xem xét tất cả các mối liên hệ đồng thời phân loại và thấy được vị trí, vai trò của các mối liên hệ."},"answer":"D"},{"id":118,"no":117,"question":"Lựa chọn phương án đúng nhất?","options":{"A":"Mối liên hệ chỉ diễn ra giữa các sự vật hiện tượng với nhau, còn trong bản thân sự vật hiện tượng không có sự liên hệ.","B":"Mối liên hệ của sự vật hiện tượng chỉ do ý chí con người tạo ra, còn bản thân sự vật hiện tượng không có sự liên hệ.","C":"Mối liên hệ của sự vật hiện tượng không chỉ diễn ra giữa các sự vật hiện tượng mà còn diễn ra ngay trong sự vật hiện tượng.","D":"Mối liên hệ của sự vật hiện tượng là do lực lượng siêu nhiên quy định."},"answer":"C"},{"id":119,"no":118,"question":"Trong lý luận về mâu thuẫn, quá trình đồng hóa và dị hóa trong cơ thể sống được gọi là gì?","options":{"A":"Những thuộc tính.","B":"Hai thuộc tính.","C":"Hai mặt đối lập.","D":"Hai yếu tố."},"answer":"C"},{"id":120,"no":119,"question":"Trong hoạt động thực tiễn, sai lầm của sự chủ quan nóng vội là do không tôn trọng quy luật nào?","options":{"A":"Quy luật thống nhất và đấu tranh của các mặt đối lập.","B":"Quy luật từ những thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại.","C":"Quy luật phủ định của phủ định.","D":"Quy luật về mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng."},"answer":"B"},{"id":121,"no":120,"question":"Xác định quan niệm sai về phủ định biện chứng?","options":{"A":"Phủ định có tính kế thừa.","B":"Phủ định có nghĩa là chấm dứt sự phát triển.","C":"Phủ định có tính phổ biến.","D":"Phủ định có tính khách quan."},"answer":"B"},{"id":122,"no":121,"question":"Ý nghĩa rút ra khi nghiên cứu quy luật thống nhất và đấu tranh của các mặt đối lập. Xác định đáp án sai?","options":{"A":"Mâu thuẫn là khách quan, khi nghiên cứu sự vật hiện tượng phải nghiên cứu về mâu thuẫn của nó.","B":"Sự vật khác nhau, mâu thuẫn khác nhau, nên phải có biện pháp phù hợp để giải quyết từng mâu thuẫn.","C":"Phải giải quyết mâu thuẫn bằng phương pháp đấu tranh chứ không dung hòa.","D":"Mâu thuẫn phụ thuộc vào cảm nhận của con người nên phải tìm cách nhận thức nó."},"answer":"D"},{"id":123,"no":122,"question":"Đâu là quan điểm siêu hình về sự phát triển?","options":{"A":"Chất của sự vật không thay đổi trong quá trình vận động và phát triển của chúng.","B":"Phát triển là sự chuyển hoá từ những thay đổi về lượng thành sự thay đổi về chất.","C":"Phát triển bao hàm sự nảy sinh chất mới và sự phủ định chất cũ.","D":"Chất của sự vật chỉ thay đổi khi lượng thay đổi đến một giới hạn nhất định."},"answer":"A"},{"id":124,"no":123,"question":"Trong xã hội, sự phát triển biểu hiện ra như thế nào?","options":{"A":"Sự xuất hiện các hợp chất mới.","B":"Sự xuất hiện các giống loài động vật, thực vật mới thích ứng tốt hơn với môi trường.","C":"Sự thay thế chế độ xã hội này bằng một chế độ xã hội khác có trình độ cao hơn.","D":"Sự thay thế cấu trúc xã hội."},"answer":"C"},{"id":125,"no":124,"question":"Theo chủ nghĩa duy vật biện chứng, những tính chất nào sau đây là tính chất của sự phát triển?","options":{"A":"Tính khách quan.","B":"Tính phổ biến.","C":"Tính đa dạng, phong phú.","D":"Tất cả các đáp án"},"answer":"D"},{"id":126,"no":125,"question":"Trong nhận thức, cần quán triệt quan điểm phát triển. Điều đó dựa trên cơ sở lý luận của nguyên lý nào?","options":{"A":"Nguyên lý về mối quan hệ phổ biến.","B":"Nguyên lý về sự phát triển.","C":"Nguyên lý về tính thống nhất vật chất của thế giới.","D":"Nguyên lý về sự nhận thức."},"answer":"B"},{"id":127,"no":126,"question":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa cái chung và cái riêng?","options":{"A":"Cái chung tồn tại khách quan, bên ngoài cái riêng.","B":"Cái riêng tồn tại khách quan không bao hàm cái chung.","C":"Cái chung và cái riêng không tồn tại đồng thời.","D":"Không có cái chung thuần tuý tồn tại ngoài cái riêng, cái chung tồn tại thông qua cái riêng."},"answer":"D"},{"id":128,"no":127,"question":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa nhân - quả?","options":{"A":"Một nguyên nhân có thể sinh ra nhiều kết quả.","B":"Một nguyên nhân nhất định trong điều kiện nhất định chỉ sinh ra một kết quả nhất định","C":"Một nguyên nhân nhất định trong điều kiện nhất định có thể sinh ra các kết quả khác nhau.","D":"Một kết quả chỉ có thể do một nguyên nhân sinh ra."},"answer":"C"},{"id":129,"no":128,"question":"Trong các luận điểm sau, đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa nội dung và hình thức?","options":{"A":"Nội dung quyết định hình thức trong sự phát triển của sự vật.","B":"Hình thức quyết định nội dung trong sự phát triển của sự vật.","C":"Hình thức và nội dung có tính độc lập với nhau.","D":"Nội dung và hình thức đều giữ vai trò như nhau"},"answer":"A"},{"id":130,"no":129,"question":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa bản chất – hiện tượng?","options":{"A":"Bản chất và hiện tượng độc lập với nhau.","B":"Bản chất nào hiện tượng ấy, bản chất đồng nhất với hiện tượng.","C":"Bản chất nào hiện tượng ấy, bản chất thay đổi thì hiện tượng cũng thay đổi theo.","D":"Bản chất là bất biến, hiện tượng thay đổi thường xuyên."},"answer":"C"},{"id":131,"no":130,"question":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa khả năng – hiện thực?","options":{"A":"Trong hoạt động thực tiễn, phải dựa vào khả năng.","B":"Trong hoạt động thực tiễn, phải dựa vào hiện thực, không cần tính đến khả năng.","C":"Trong hoạt động thực tiễn phải dựa vào hiện thực, đồng thời phải tính đến khả năng.","D":"Trong hoạt động thực tiễn, phải dựa vào hiện thực."},"answer":"C"},{"id":132,"no":131,"question":"Theo chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","options":{"A":"Chất là tính quy định vốn có của sự vật.","B":"Chất là tổng hợp hữu cơ các thuộc tính của sự vật nói lên sự vật là cái gì.","C":"Chất của sự vật đồng nhất với thuộc tính của nó.","D":"Chất là cái để phân biệt sự vật hiện tượng này với sự vật hiện tượng khác."},"answer":"C"},{"id":133,"no":132,"question":"Theo chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","options":{"A":"Chất tồn tại khách quan bên ngoài sự vật.","B":"Chất tồn tại khách quan gắn liền với sự vật.","C":"Không có chất thuần tuý bên ngoài sự vật.","D":"Chất là cái vốn có của sự vật."},"answer":"A"},{"id":134,"no":133,"question":"Theo chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","options":{"A":"Lượng là tính quy định vốn có của sự vật.","B":"Lượng nói lên quy mô, trình độ phát triển của sự vật.","C":"Lượng của sự vật phụ thuộc vào ý chí của con người.","D":"Lượng tồn tại khách quan gắn liền với sự vật."},"answer":"C"},{"id":135,"no":134,"question":"Theo chủ nghĩa duy vật biện chứng, Độ là?","options":{"A":"Độ là phạm trù chỉ sự biến đổi về lượng và chất của sự vật hiện tượng.","B":"Độ là phạm trù chỉ sự biến đổi về chất của sự vật hiện tượng.","C":"Độ là phạm trù chỉ giới hạn biến đổi của lượng mà chưa làm thay đổi về chất của sự vật hiện tượng.","D":"Độ là phạm trù chỉ sự biến đổi về lượng, tới điểm nút của sự vật hiện tượng."},"answer":"C"},{"id":136,"no":135,"question":"Giới hạn từ 0 độ C đến 100 độ C được gọi là gì trong quy luật lượng-chất?","options":{"A":"Độ.","B":"Chất.","C":"Lượng.","D":"Bước nhảy."},"answer":"A"},{"id":137,"no":136,"question":"Khi nước chuyển từ trạng thái lỏng sang trạng thái khí tại 100 độ C thì được gọi là gì trong quy luật lượng- chất?","options":{"A":"Độ.","B":"Bước nhảy.","C":"Chuyển hoá về lượng.","D":"Bay hơi"},"answer":"B"},{"id":138,"no":137,"question":"Tính quy định nói lên quy mô, trình độ phát triển của sự vật được gọi là gì?","options":{"A":"Chất.","B":"Lượng.","C":"Độ.","D":"Điểm nút."},"answer":"B"},{"id":139,"no":138,"question":"Theo chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","options":{"A":"Trong giới hạn của độ, sự thay đổi của lượng chưa làm cho chất của sự vật biến đổi.","B":"Trong giới hạn của độ, sự thay đổi của lượng đều đưa đến sự thay đổi chất của sự vật.","C":"Chỉ khi lượng đạt đến giới hạn của độ (điểm nút) mới làm cho chất của sự vật thay đổi.","D":"Khi bước nhảy được thực hiện thì sự vật chuyển hoá"},"answer":"B"},{"id":140,"no":139,"question":"Theo chủ nghĩa duy vật biện chứng?","options":{"A":"Sự biến đổi về chất là kết quả sự biến đổi về lượng của sự vật.","B":"Không phải sự biến đổi về chất nào cũng là kết quả của sự biến đổi về lượng.","C":"Chất không có tác động gì đến sự thay đổi của lượng.","D":"Chất biến đổi trước khi có sự biến đổi của lượng."},"answer":"B"},{"id":141,"no":140,"question":"Theo chủ nghĩa duy vật biện chứng?","options":{"A":"Quá trình phát triển của sự vật là quá trình thay đổi về lượng.","B":"Quá trình phát triển của sự vật là quá trình thay đổi về chất.","C":"Quá trình phát triển của sự vật là quá trình chuyển hoá từ sự thay đổi về lượng sang sự thay đổi về chất và ngược lại.","D":"Quá trình phát triển của sự vật là quá trình biến đổi đồng thời của lượng và chất."},"answer":"D"},{"id":142,"no":141,"question":"Trong hoạt động thực tiễn, sai lầm của trì trệ bảo thủ là do không tôn trọng quy luật nào của phép biện chứng duy vật?","options":{"A":"Quy luật Lượng- chất.","B":"Quy luật Phủ định của phủ định.","C":"Quy luật Mâu thuẫn.","D":"Quy luật vận động"},"answer":"A"},{"id":143,"no":142,"question":"Cơ sở lý luận của quan điểm toàn diện là gì?","options":{"A":"Nguyên lý về sự phát triển.","B":"Nguyên lý về mối liên hệ phổ biến.","C":"Quy luật về sự đấu tranh của các mặt đối lập.","D":"Quy luật phủ định của phủ định."},"answer":"B"},{"id":144,"no":143,"question":"Nguyên lý về sự phát triển yêu cầu phải tuân thủ nguyên tắc gì trong hoạt động nhận thức và thực tiễn?","options":{"A":"Lịch sử.","B":"Phát triển.","C":"Toàn diện.","D":"Khách quan."},"answer":"B"},{"id":145,"no":144,"question":"Quy luật nào vạch ra nguồn gốc, động lực của sự vận động, phát triển?","options":{"A":"Quy luật thống nhất và đấu tranh của các mặt đối lập.","B":"Quy luật từ những thay đổi dần về lượng dẫn đến sự thay đổi về chất và ngược lại.","C":"Quy luật phủ định của phủ định.","D":"Quy luật về mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng."},"answer":"A"},{"id":146,"no":145,"question":"Quy luật nào vạch ra cách thức (phương thức) vận động, phát triển của sự vật?","options":{"A":"Quy luật từ những thay đổi dần về lượng dẫn đến sự thay đổi về chất và ngược lại.","B":"Quy luật thống nhất và đấu tranh của các mặt đối lập.","C":"Quy luật phủ định của phủ định.","D":"Quy luật về sự phù hợp của quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất."},"answer":"A"},{"id":147,"no":146,"question":"Câu ca dao: “Một cây làm chẳng nên non, Ba cây chụm lại nên hòn núi cao” thể hiện nội dung quy luật nào của phép biện chứng duy vật?","options":{"A":"Quy luật mâu thuẫn","B":"Quy luật phủ định của phủ định","C":"Quy luật chuyển hoá từ những sự thay đổi về lượng dẫn đến sự thay đổi về chất và ngược lại.","D":"Quy luật về mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng"},"answer":"C"},{"id":148,"no":147,"question":"Trong lý luận về mâu thuẫn người ta gọi quá trình đồng hoá và dị hoá trong cơ thể sống là gì?","options":{"A":"Hai yếu tố","B":"Những sự vật","C":"Những thuộc tính","D":"Hai mặt đối lập."},"answer":"D"},{"id":149,"no":148,"question":"Tổng hợp những thuộc tính khách quan vốn có của sự vật, nói lên sự vật là cái gì, phân biệt nó với cái khác. Đó là khái niệm nào?","options":{"A":"Lượng.","B":"Chất.","C":"Độ.","D":"Điểm nút."},"answer":"B"},{"id":150,"no":149,"question":"Khái niệm nào nói lên con số các thuộc tính cấu thành của sự vật hiện tượng?","options":{"A":"Chất.","B":"Bước nhảy.","C":"Lượng.","D":"Điểm nút."},"answer":"C"},{"id":151,"no":150,"question":"Sự thống nhất giữa chất và lượng được thể hiện trong phạm trù nào?","options":{"A":"Phạm trù độ.","B":"Phạm trù lượng.","C":"Phạm trù điểm nút.","D":"Phạm trù bước nhảy."},"answer":"A"},{"id":152,"no":151,"question":"Những điểm giới hạn mà tại đó sự thay đổi về lượng sẽ làm thay đổi về chất của sự vật được gọi là gì?","options":{"A":"Bước nhảy.","B":"Bước nhảy toàn bộ.","C":"Điểm nút.","D":"Bước nhảy dần dần."},"answer":"C"},{"id":153,"no":152,"question":"Phạm trù triết học nào dùng để chỉ giai đoạn chuyển hoá về chất của sự vật do những thay đổi về lượng trước đó gây ra?","options":{"A":"Độ.","B":"Điểm nút.","C":"Chất.","D":"Bước nhảy."},"answer":"D"},{"id":154,"no":153,"question":"Quy luật nào vạch ra khuynh hướng của sự r":"A"},{"id":174,"no":173,"question":"Theo chủ nghĩa duy vật biện chứng, phát triển là quá trình?","options":{"A":"Tiến lên theo đường tròn khép kín.","B":"Tiến lên theo đường quanh co, phức tạp, hình xoáy ốc đi lên.","C":"Tiến lên theo đường thẳng tắp.","D":"Tiến lên tuần tự"},"answer":"B"},{"id":175,"no":174,"question":"Sự vật mới ra đời bao giờ cũng trên cơ sở những cái đã có của sự vật cũ, qua đó tiến hành chọn lọc những cái tích cực, tiến bộ, phù hợp để tiếp tục phát triển. Điều này thể hiện tính chất gì của sự phát triển?","options":{"A":"Tính khách quan.","B":"Tính phổ biến.","C":"Tính đa dạng, phong phú.","D":"Tính kế thừa."},"answer":"D"},{"id":176,"no":175,"question":"Quan điểm nào góp phần khắc phục tư tưởng bảo thủ, trì trệ, định kiến trong hoạt động nhận thức và hoạt động thực tiễn?","options":{"A":"Quan điểm lịch sử cụ thể.","B":"Quan điểm toàn diện.","C":"Quan điểm phát triển.","D":"Quan điểm duy vật."},"answer":"C"},{"id":177,"no":176,"question":"Quan điểm toàn diện, quan điểm lịch sử cụ thể và quan điểm phát triển được rút ra từ?","options":{"A":"Mối quan hệ giữa vật chất và ý thức.","B":"Hai nguyên lý cơ bản của phép biện chứng duy vật.","C":"Mối quan hệ giữa nhận thức và thực tiễn.","D":"Các quy luật cơ bản của phép biện chứng duy vật."},"answer":"D"},{"id":178,"no":177,"question":"Theo quan điểm chủ nghĩa duy vật biện chứng, luận điểm nào sai?","options":{"A":"Cái chung chỉ tồn tại trong cái riêng, thông qua cái riêng mà biểu hiện sự tồn tại của mình.","B":"Quan hệ giữa cái chung và cái riêng là quan hệ có tính chủ quan.","C":"Quan hệ giữa cái chung và cái riêng là có tính phổ biến.","D":"Cái riêng là cái toàn bộ, phong phú hơn cái chung, cái chung là cái bộ phận, nhưng sâu sắc hơn cái riêng."},"answer":"B"},{"id":179,"no":178,"question":"Theo chủ nghĩa duy vật biện chứng?","options":{"A":"Cái chung chỉ tồn tại trong cái riêng.","B":"Cái riêng chỉ tồn tại trong cái chung.","C":"Cái chung và cái riêng đều tồn tại trong nhau.","D":"Cái chung và cái riêng đều tồn tại độc lập với nhau."},"answer":"C"},{"id":180,"no":179,"question":"Theo chủ nghĩa duy vật biện chứng, cái tất nhiên là cái do?","options":{"A":"Những nguyên nhân cơ bản bên trong sự vật quy định.","B":"Những nguyên nhân cơ bản bên ngoài sự vật quy định.","C":"Những nguyên nhân chủ quan.","D":"Cả nguyên nhân bên trong và nguyên nhân bên ngoài sự vật quy định."},"answer":"A"},{"id":181,"no":180,"question":"Phạm trù triết học nào dùng để chỉ tổng hợp tất cả những mặt, những yếu tố, những quá trình tạo nên sự vật?","options":{"A":"Bản chất.","B":"Nội dung.","C":"Hiện thực.","D":"Hình thức."},"answer":"C"},{"id":182,"no":181,"question":"Khả năng được hình thành do quy luật vận động nội tại của sự vật quy định thì được gọi là?","options":{"A":"Khả năng thực tế.","B":"Khả năng tất nhiên.","C":"Khả năng ngẫu nhiên.","D":"Khả năng nội tại."},"answer":"B"},{"id":183,"no":182,"question":"Tổng hợp tất cả những mặt, những mối liên hệ tất nhiên, tương đối ổn định bên trong sự vật, quy định sự vận động và phát triển của sự vật được gọi là?","options":{"A":"Nội dung.","B":"Bản chất.","C":"Hình thức bên trong.","D":"Hiện tượng."},"answer":"B"},{"id":184,"no":183,"question":"Không có hình thức nào tồn tại thuần tuý không chứa nội dung và cũng không có nội dung nào lại không tồn tại trong những hình thức xác định. Quan điểm này thể hiện?","options":{"A":"Vai trò quyết định của nội dung đối với hình thức.","B":"Sự tác trở lại của hình thức đối với nội dung.","C":"Mối quan hệ biện chứng giữa nội dung và hình thức.","D":"Sự độc lập giữa nội dung và hình thức"},"answer":"C"},{"id":185,"no":184,"question":"Quy luật được coi là hạt nhân của phép biện chứng duy vật là?","options":{"A":"Quy luật thống nhất và đấu tranh của các mặt đối lập.","B":"Quy luật từ những thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại.","C":"Quy luật phủ định của phủ định.","D":"Quy luật lực lượng sản xuất và quan hệ sản xuất."},"answer":"A"},{"id":186,"no":185,"question":"Theo chủ nghĩa duy vật biện chứng, cách thức (phương thức) chung của sự phát triển là?","options":{"A":"Đấu tranh của các mặt đối lập để giải quyết mâu thuẫn.","B":"Sự thay đổi về lượng dẫn đến sự thay đổi về chất và ngược lại.","C":"Quá trình phủ định cái cũ và sự ra đời của cái mới.","D":"các câu trên đều sai."},"answer":"C"},{"id":187,"no":186,"question":"Theo chủ nghĩa duy vật biện chứng, thống nhất của hai mặt đối lập là?","options":{"A":"Sự bài trừ, gạt bỏ lẫn nhau giữa hai mặt đối lập.","B":"Sự nương tựa lẫn nhau, tồn tại không tách rời nhau, mặt này lấy mặt kia làm tiền đề cho sự tồn tại của mình.","C":"Hai mặt đối lập có tính chất, đặc điểm, khuynh hướng phát triển trái ngược nhau.","D":"Quá trình cái mới ra đời thay thế cái cũ."},"answer":"B"},{"id":188,"no":187,"question":"Theo chủ nghĩa duy vật biện chứng, đấu tranh của hai mặt đối lập là?","options":{"A":"Sự tác động qua lại theo xu hướng bài trừ và phủ định lẫn nhau.","B":"Sự hỗ trợ và nương tựa lẫn nhau.","C":"Sự gắn bó lẫn nhau giữa hai mặt đối lập biện chứng.","D":"Sự bổ sung lẫn nhau giữa hai mặt đối lập."},"answer":"A"},{"id":189,"no":188,"question":"Theo chủ nghĩa duy vật biện chứng, phủ định biện chứng là?","options":{"A":"Sự phủ định tự thân, tạo điều kiện cho sự ra đời của cái mới tiến bộ thay thế cái cũ.","B":"Sự phủ định có sự tác động của sự vật khác.","C":"Sự phủ định có sự tác động của sự vật khác để tạo điều kiện cho sự ra đời của cái mới tiến bộ thay thế cái cũ.","D":"Phủ định sạch trơn."},"answer":"C"},{"id":190,"no":189,"question":"Theo chủ nghĩa duy vật biện chứng, quy luật phủ định của phủ định làm rõ vấn đề gì?","options":{"A":"Nguồn gốc của sự phát triển.","B":"Khuynh hướng của sự vận động, phát triển.","C":"Cách thức của sự phát triển.","D":"Động lực của sự phát triển."},"answer":"B"},{"id":191,"no":190,"question":"Theo chủ nghĩa duy vật biện chứng, mặt đối lập là?","options":{"A":"Những mặt, yếu tố, thuộc tính, khuynh hướng trái ngược nhau, cấu tạo nên sự vật.","B":"Những mặt khác nhau nằm },{"id":198,"no":197,"question":"Hình ảnh về sự vật được tái hiện trong đầu khi không còn tri giác trực tiếp sự vật được gọi là gì?","options":{"A":"Biểu tượng","B":"Phán đoán","C":"Khái niệm","D":"Suy lý"},"answer":"A"},{"id":199,"no":198,"question":"Trường phái triết học nào cho rằng thực tiễn là cơ sở chủ yếu và trực tiếp của nhận thức?","options":{"A":"Chủ nghĩa duy tâm khách quan.","B":"Chủ nghĩa duy vật siêu hình.","C":"Chủ nghĩa duy vật biện chứng.","D":"Chủ nghĩa duy lý."},"answer":"C"},{"id":200,"no":199,"question":"Hoạt động nào sau đây không phải là hoạt động thực tiễn?","options":{"A":"Hoạt động chính trị- xã hội","B":"Hoạt động thực nghiệm khoa học","C":"Hoạt động sản xuất vật chất","D":"Hoạt động vui chơi giải trí"},"answer":"D"},{"id":201,"no":200,"question":"Câu thành ngữ “Miệng nam mô, bụng bồ dao găm” phản ánh sự mâu thuẫn của cặp phạm trù nào?","options":{"A":"Chung – riêng","B":"Bản chất – hiện tượng","C":"Nội dung -hình thức","D":"Nguyên nhân – Kết quả"},"answer":"B"}];
